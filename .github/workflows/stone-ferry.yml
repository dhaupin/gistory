# Stone ferry - the standing CI-cut lane for gistory's OWN horcrux stone.
#
# scripts/cut-gistory.py cuts the host's own refresh stone from its
# committed brain texts, then the assembled stone is sha-gated against the
# offline blob id. A refusal never commits: if the regenerated bytes did
# not round-trip, the gate exits 1 and the workflow fails loudly, so a
# corrupt stone can no more reach main than it could via the hand lane -
# without anyone re-typing base64.
#
# The family-stone cutter (scripts/cut-stones.py: eyestruct's magpie pair +
# poststruct's seed transfer) retired 2026-11-02 with the forge-role
# decouple. Those stones are other repos' brains; eyestruct already carries
# its magpie pair upstream (dhaupin/eyestruct horcrux/), and gistory no
# longer cuts family stones. The committed magpie/poststruct stones stay in
# the vault as delivered lineage (raster-gated by framework-gate.mjs) - they
# are simply no longer regenerated here.
#
# Idempotent over an unchanged tree: regeneration is byte-deterministic,
# so a run whose stone already matches produces no diff and no commit.
name: Stone ferry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stone-ferry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Cut gistory's own stone from its committed sources
        run: python3 scripts/cut-gistory.py

      - name: Sha-gate the assembled stone (offline blob id, git hash-object)
        run: |
          set -euo pipefail
          # Pin re-cut with the 2026-10-28 npm-adopt graduation text (the
          # sources moved the brain text to the EYESTRUCT_TREE + npm-pin
          # wording; the ferry correctly refused the stale stone).
          expect_gistory="2779552f9a7996c2be3dc936ef521de2253a46dc"
          actual_gistory="$(git hash-object horcrux/stones/gistory-p_gistory-castles-2026-r2.svg)"
          echo "expect gistory r2: $expect_gistory"
          echo "actual gistory r2: $actual_gistory"
          test "$actual_gistory" = "$expect_gistory" \
            || { echo "FERRY GATE FAIL: gistory r2 stone did not round-trip; refusing to commit"; exit 1; }
          echo "ferry gate: the gistory stone round-trips; committing"

      - name: Commit the assembled stone
        run: |
          set -euo pipefail
          git config user.name  "stone-ferry"
          git config user.email "actions@users.noreply.github.com"
          git add horcrux/stones/gistory-p_gistory-castles-2026-r2.svg
          if [ -d .cut-tmp/parts ]; then
            git rm -r -q .cut-tmp/parts
          fi
          if ! git diff --cached --quiet; then
            git commit -m "horcrux: cut the gistory r2 stone (sha-gated ferry)" \
                       -m "The stone regenerates from committed sources and is sha-gated against its offline blob id (2779552f) before anything is committed - the CI-cut lane, not hand-carry. Brain parity copies ride .cut-tmp."
            git push origin main
          else
            echo "nothing new to commit (stone already current)"
          fi
