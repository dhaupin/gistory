# Stone ferry - the standing CI-cut lane for the horcrux stones.
#
# scripts/cut-stones.py regenerates the stones it owns (magpie r2 from
# the r1 stone + patched receipts, poststruct wordprint from the mount's
# PRD + seed brain texts) and scripts/cut-gistory.py cuts the host's own
# refresh stone from its committed brain texts - then every assembled
# stone is sha-gated against the offline blob id. A refusal never
# commits: if the regenerated bytes did not round-trip, the gate exits 1
# and the workflow fails loudly, so a corrupt stone can no more reach
# main than it could via the hand lane - without anyone re-typing base64.
#
# Idempotent over an unchanged tree: regeneration is byte-deterministic,
# so a run whose stones already match produces no diff and no commit.
# The 2026-10-26 transport parts lane (.cut-tmp/parts) is swept after its
# one-time use; brains ride the parity copies the cutter also writes.
name: Stone ferry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stone-ferry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Cut the stones from their committed sources (regeneration lane)
        run: |
          python3 scripts/cut-stones.py
          python3 scripts/cut-gistory.py

      - name: Sha-gate the assembled stones (offline blob ids, git hash-object)
        run: |
          set -euo pipefail
          expect_magpie="0bde5b6db94edac65636a34648db13f116cb436e"
          expect_poststruct="295e5a170c6761e14e71cff0e9b34f70f08327ee"
          expect_gistory="a1a01c2d6bd46225b5178437f5e0e8de0536cd64"
          actual_magpie="$(git hash-object horcrux/stones/magpie-p_mirror-eyes-2026-2.svg)"
          actual_poststruct="$(git hash-object horcrux/stones/poststruct-p_wordprint-2026.svg)"
          actual_gistory="$(git hash-object horcrux/stones/gistory-p_gistory-castles-2026-2.svg)"
          echo "expect magpie r2 : $expect_magpie"
          echo "actual magpie r2 : $actual_magpie"
          echo "expect poststruct: $expect_poststruct"
          echo "actual poststruct: $actual_poststruct"
          echo "expect gistory r2: $expect_gistory"
          echo "actual gistory r2: $actual_gistory"
          test "$actual_magpie" = "$expect_magpie" \
            || { echo "FERRY GATE FAIL: magpie r2 stone did not round-trip; refusing to commit"; exit 1; }
          test "$actual_poststruct" = "$expect_poststruct" \
            || { echo "FERRY GATE FAIL: poststruct stone did not round-trip; refusing to commit"; exit 1; }
          test "$actual_gistory" = "$expect_gistory" \
            || { echo "FERRY GATE FAIL: gistory r2 stone did not round-trip; refusing to commit"; exit 1; }
          echo "ferry gate: all three stones round-trip; committing"

      - name: Commit assembled stones, sweep the transport parts
        run: |
          set -euo pipefail
          git config user.name  "stone-ferry"
          git config user.email "actions@users.noreply.github.com"
          git add horcrux/stones/magpie-p_mirror-eyes-2026-2.svg \
                  horcrux/stones/poststruct-p_wordprint-2026.svg \
                  horcrux/stones/gistory-p_gistory-castles-2026-2.svg
          if [ -d .cut-tmp/parts ]; then
            git rm -r -q .cut-tmp/parts
          fi
          if ! git diff --cached --quiet; then
            git commit -m "horcrux: cut magpie r2 + poststruct seed + gistory r2 stones (sha-gated ferry)" \
                       -m "Every stone regenerates from committed sources and is sha-gated against its offline blob id (0bde5b6d / 295e5a17 / a1a01c2d) before anything is committed - the CI-cut lane, not hand-carry. Brain parity copies ride .cut-tmp."
            git push origin main
          else
            echo "nothing new to commit (stones already current)"
          fi
