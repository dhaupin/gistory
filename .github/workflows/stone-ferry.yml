# Stone ferry - assembles the 2026-10-26 horcrux stones from their
# committed transport parts (.cut-tmp/parts/*, landed during the session
# whose hand lane kept corrupting 30KB+ single-line base64 payloads).
#
# Self-verifying: scripts/cut-stones.py regenerates both stones on the
# runner from the same parts the hand lane would have consumed, then each
# assembled stone is sha-gated against the blob id computed OFFLINE. A
# refusal never commits: if the regenerated bytes did not round-trip, the
# gate exits 1 and the workflow fails loudly, so a corrupt stone can no
# more reach main than it could via the hand lane - without anyone
# re-typing 40KB of base64.
#
# Self-cleaning: after this commit the transport parts are swept
# (git rm), so later pushes find no parts and the job no-ops.
name: Stone ferry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stone-ferry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Nothing to ferry if the transport parts are already consumed
        id: gate
        run: |
          if [ ! -d .cut-tmp/parts ]; then
            echo "no .cut-tmp/parts - the parts are consumed; nothing to ferry"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cut the stones from the committed parts (regeneration lane)
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/cut-stones.py

      - name: Sha-gate the assembled stones (offline blob ids, git hash-object)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          expect_magpie="0bde5b6db94edac65636a34648db13f116cb436e"
          expect_poststruct="295e5a170c6761e14e71cff0e9b34f70f08327ee"
          actual_magpie="$(git hash-object horcrux/magpie-p_mirror-eyes-2026-2.svg)"
          actual_poststruct="$(git hash-object horcrux/poststruct-p_wordprint-2026.svg)"
          echo "expect magpie r2 : $expect_magpie"
          echo "actual magpie r2 : $actual_magpie"
          echo "expect poststruct: $expect_poststruct"
          echo "actual poststruct: $actual_poststruct"
          test "$actual_magpie" = "$expect_magpie" \
            || { echo "FERRY GATE FAIL: magpie r2 stone did not round-trip; refusing to commit"; exit 1; }
          test "$actual_poststruct" = "$expect_poststruct" \
            || { echo "FERRY GATE FAIL: poststruct stone did not round-trip; refusing to commit"; exit 1; }
          echo "ferry gate: both stones round-trip; committing"

      - name: Commit assembled stones, sweep the transport parts
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name  "stone-ferry"
          git config user.email "actions@users.noreply.github.com"
          git add horcrux/magpie-p_mirror-eyes-2026-2.svg \
                  horcrux/poststruct-p_wordprint-2026.svg
          if [ -d .cut-tmp/parts ]; then
            git rm -r -q .cut-tmp/parts
          fi
          if ! git diff --cached --quiet; then
            git commit -m "horcrux: assemble magpie r2 + poststruct seed stones from transport parts (sha-gated ferry)" \
                       -m "The regenerated stones are sha-gated against offline blob ids (0bde5b6d... / 295e5a17...) so a corrupt stone can no more reach main via this lane than via the hand lane - without re-typing 40KB of base64. Transport parts (.cut-tmp/parts/*) are swept in the same commit; brain parity copies (.cut-tmp/magpie-brain/, .cut-tmp/poststruct-brain/) stay."
            git push origin main
          else
            echo "nothing new to commit (stones already correct)"
          fi
