# Monoforge ferry - the staging mount's tool tree derives from its lock
# archive, and the lock archive is fetched from its OWN upstream home
# (dhaupin/monoforge, the repo that owns this tool), then sha256-gated
# against the offline value BEFORE anything unpacks.
#
# Why fetch instead of transport: a 15KB-per-part base64 hand lane was
# tried first and corrupted on arrival (one fabricated tail from a
# truncated stdout, exactly the drift class this family already knew);
# fetching from upstream transports NOTHING, and the sha gate means a
# hostile or broken upstream cannot unpack a wrong lock - the fetch is
# verified before tar ever opens it.
#
# The unpack merges over monoforge-staging/ (the receipts this mount
# adds on top - labs/, horcrux/README - are not in the lock, so they
# survive; known limitation: a re-lock that DELETES a tool file leaves
# the stale one behind, so re-locks should sweep first). THE CONVERGE
# LAW (2026-10-27): main's tracked bytes ARE the rig generation, and a
# committed patch has no authority over them. The converge is derived
# at run time - any tracked file the sha-gated unpack clobbered with the
# lock's older byte generation is restored to HEAD - and the standing
# horcrux/rig-overlay.patch is RE-DERIVED from that exact delta, so its
# bytes always apply zero-conflict against the sha-gated lock and stale
# hunks retire in the ferry's own commit (the retired one-shot emit
# lanes' append style remains readable history, never load-bearing).
# The retired static site/ is swept (a lock member the mount dropped).
#
# Self-cleaning + self-healing: the job re-runs on every push and no-ops
# when main already carries the unpacked tree for the current lock sha
# (commit step: unpack produces no diff -> nothing to commit). When the
# upstream lock turns over someday, the sha gate refuses and the mount
# waits for the retarget alongside the re-pinned archive.

name: Monoforge ferry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monoforge-ferry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the lock tarball from its upstream home (dhaupin/monoforge)
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/dhaupin/monoforge/main/horcrux/monoforge-0.9.0-lock.tar.gz" \
            -o /tmp/mf-lock.tar.gz
          expect="046908c681a607d355925146234c7d4adf3726581a2e8799544954d7c4cf2952"
          actual="$(sha256sum /tmp/mf-lock.tar.gz | cut -d' ' -f1)"
          echo "expect: $expect"
          echo "actual: $actual"
          test "$actual" = "$expect" \
            || { echo "FERRY GATE FAIL: fetched lock is not the sha-gated archive; refusing to unpack anything"; exit 1; }
          echo "ferry gate: upstream lock round-trips byte-exact"

      - name: Land the lock + unpack the tool tree beside it
        run: |
          set -euo pipefail
          mkdir -p monoforge-staging/horcrux
          cp /tmp/mf-lock.tar.gz monoforge-staging/horcrux/monoforge-0.9.0-lock.tar.gz
          tar -xzf /tmp/mf-lock.tar.gz -C monoforge-staging --strip-components=1
          echo "unpacked $(find monoforge-staging -type f | wc -l) files"

      # 2026-10-27 lane-war receipts: the lock's docs-lane generation is OLDER
      # than the flowforge rig pass the mount already carries (0b3c118/
      # 71efbc4/cc7d50e/1d372c9; then run 40468994469 showed a committed
      # patch going stale the moment a direct carry outran its hunks). The
      # converge therefore derives from THIS unpack, never from stored
      # hunks: capture the restored delta, reset each clobbered tracked
      # file to HEAD, then re-derive the standing patch from the same
      # lists. Mount-only paths (web/, MANIFEST.md, verb/packs docs, PRDs)
      # survive the tar unpack untouched; site/ is swept here.
      - name: Converge the unpacked mount to tracked bytes (derived overlay)
        run: |
          set -euo pipefail
          delta="$(git diff --name-only -- monoforge-staging/ || true)"
          # $() strips the trailing newline; without one, `while read` would
          # silently drop the LAST delta path. printf '%s\n' restores it.
          printf '%s\n' "$delta" > /tmp/mf-delta.list
          if [ -n "$delta" ]; then
            echo "$delta" | while IFS= read -r f; do
              git checkout -- "$f"
              echo "converged from HEAD: $f"
            done
          else
            echo "no tracked drift (mount already correct for this lock)"
          fi
          rm -rf monoforge-staging/site
          echo "overlay applied: mount converges to the rig generation over the sha-gated lock"

      - name: Prove the unpacked tool still self-tests green
        run: node test/run.mjs
        working-directory: monoforge-staging

      # Derive, don't carry: the standing rig-overlay.patch is regenerated
      # from the SAME delta the converge just restored (fresh unpack ->
      # restored bytes, the mono-rig-emit lane's own method), so it always
      # applies zero-conflict against the sha-gated lock and the two stale
      # docs hunks of the 2026-10-27 patch retire here. diff exit 1 means
      # the files DIFFER - that is the whole point of the loop - so the
      # guard swallows exactly that exit and still fails loudly on 2.
      - name: Re-derive horcrux/rig-overlay.patch from this same delta
        run: |
          set -euo pipefail
          rm -rf /tmp/lockbase && mkdir -p /tmp/lockbase
          tar -xzf /tmp/mf-lock.tar.gz -C /tmp/lockbase
          base="/tmp/lockbase/$(ls /tmp/lockbase)"
          : > /tmp/rig-overlay.patch
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            rel="${f#monoforge-staging/}"
            [ -f "$base/$rel" ] || continue
            diff -u "$base/$rel" "$f" \
              --label "a/monoforge-staging/$rel" --label "b/monoforge-staging/$rel" \
              >> /tmp/rig-overlay.patch || [ $? -eq 1 ]
          done < /tmp/mf-delta.list
          cp /tmp/rig-overlay.patch horcrux/rig-overlay.patch
          echo "patch sha256: $(sha256sum horcrux/rig-overlay.patch | cut -d' ' -f1)"
          echo "patch paths: $(grep -c '^--- a/' horcrux/rig-overlay.patch)"

      - name: Gate the derived patch (dry-run over a second fresh unpack, cmp byte-exact)
        run: |
          set -euo pipefail
          rm -rf /tmp/locktest && mkdir -p /tmp/locktest
          tar -xzf /tmp/mf-lock.tar.gz -C /tmp/locktest
          base2="/tmp/locktest/$(ls /tmp/locktest)"
          rm -rf /tmp/patchtest && mkdir -p /tmp/patchtest/monoforge-staging
          cp -r "$base2"/. /tmp/patchtest/monoforge-staging/
          ( cd /tmp/patchtest && patch -p1 --force --quiet < "$GITHUB_WORKSPACE/horcrux/rig-overlay.patch" )
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            cmp "/tmp/patchtest/$f" "$f" \
              || { echo "PATCH GATE FAIL: $f diverges after patch"; exit 1; }
          done < /tmp/mf-delta.list
          echo "PATCH GATE PASS: the derived patch converges the lock to the rig generation"

      - name: Commit the assembled mount + the re-derived patch (no-op when already correct)
        run: |
          set -euo pipefail
          git config user.name  "monoforge-ferry"
          git config user.email "actions@users.noreply.github.com"
          git add -A monoforge-staging/ horcrux/rig-overlay.patch
          if ! git diff --cached --quiet; then
            git commit -m "monoforge: assemble monoforge-staging mount from its upstream lock archive (fetched + sha-gated)" \
                       -m "The mount's tool tree is 0.9.0 UNCHANGED, unpacked from horcrux/monoforge-0.9.0-lock.tar.gz fetched from dhaupin/monoforge (sha256 046908c6... gated before unpack). The converge is derived from this unpack (tracked bytes are authoritative) and horcrux/rig-overlay.patch is re-derived from the same delta, so it always applies zero-conflict against the sha-gated lock - stale hunks retire in this commit. The unpacked tool re-ran its own self-test (stamp + doctor + lock refusals) on the runner before anything was committed."
            git push origin main
          else
            echo "nothing new to commit (mount already correct for this lock)"
          fi

      - name: Sweep the retired transport parts (the fetch lane replaced them)
        run: |
          set -euo pipefail
          if [ -d .cut-tmp/mfparts ]; then
            git rm -r -q .cut-tmp/mfparts || true
            git commit -m "monoforge ferry: sweep the retired transport parts" \
                       -m "The base64 part load corrupted on arrival (a fabricated tail landed as mfpart-aa); the fetch-from-upstream + sha gate replaces it. Nothing else changes."
            git push origin main
          fi
