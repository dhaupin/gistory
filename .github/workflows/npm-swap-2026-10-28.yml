# eyestruct@npm swap 2026-10-28 (canon install) - dispatch lane.
# The three target workflows ride the .github/carriers/npm-swap-2026-10-28/
# gz.b64 carriers (the family's canonical transport shape: cat parts -> decode
# -> gunzip -> sha256 gate). The gates are pinned to the canon shas, so a
# drifted transcription fails here instead of landing. On success the lane
# installs all three files, retires the carrier dirs (including both earlier
# drifted sets), and commits + pushes - the following verify run runs green
# from npm-landed bytes (no upstream checkout anywhere).
name: eyestruct at npm swap (canon install)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-swap-2026-10-28
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the three targets
        run: |
          set -euo pipefail
          cat .github/carriers/npm-swap-2026-10-28/ci.part-* | base64 -d -i > ci.yml.gz
          cat .github/carriers/npm-swap-2026-10-28/ratify.part-* | base64 -d -i > eyes-ratify.yml.gz
          base64 -d .github/carriers/npm-swap-2026-10-28/emit.b64 > mono-web-emit.yml.gz
          gunzip -c ci.yml.gz > ci.yml
          gunzip -c eyes-ratify.yml.gz > eyes-ratify.yml
          gunzip -c mono-web-emit.yml.gz > mono-web-emit.yml

      - name: Sha gates (canon pins)
        run: |
          set -euo pipefail
          test "$(sha256sum ci.yml | cut -d' ' -f1)" = "dbd0972ef1ad764a52b9cf746bc0bc5bbf3c04571d40026cf907abd197a8bec8"
          test "$(sha256sum eyes-ratify.yml | cut -d' ' -f1)" = "bc605c0475bf23aebb36be69b3c288f8dd478aa9a53065f490535969e43b5df8"
          test "$(sha256sum mono-web-emit.yml | cut -d' ' -f1)" = "421f15fd8ec2ee3da67740682e82ea588faf3d21195837f558aada04b649bbf8"
          echo "sha gates pass - installing"

      - name: Install, retire carriers, commit
        run: |
          set -euo pipefail
          cp ci.yml .github/workflows/ci.yml
          cp eyes-ratify.yml .github/workflows/eyes-ratify.yml
          cp mono-web-emit.yml .github/workflows/mono-web-emit.yml
          git add .github/workflows/ci.yml .github/workflows/eyes-ratify.yml .github/workflows/mono-web-emit.yml
          git rm -r -q .github/carriers/npm-swap-2026-10-28 .github/carriers/swap-2026-10-28 .github/carriers/swap2-2026-10-28
          git config user.name "eyestruct npm swap"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "eyestruct@npm swap: canon yaml landed from the gz.b64 carriers (sha-pinned)"
          git push
          echo "installed and pushed"
