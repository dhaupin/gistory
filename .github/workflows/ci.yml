# Verify: everything that must be true before a migration is allowed to touch
# the live database.
#
# This job is also the gate for .github/workflows/migrate.yml — a migration to
# production only runs if this job passed on the same commit. That ordering is
# the whole point: a bad commit should never be able to reach D1 and then fail
# its own typecheck.
#
# The browser suites (tests/ui, scripts/ui-audit) are intentionally NOT here.
# They need a Chromium download and a running dev server, which makes CI slow
# and flaky for a repo this size. Run them locally with `bun run test:ui` and
# `bun run ui:audit` before pushing; they are the only suite that exercises
# rendering, so do not skip them locally on a UI change.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch. A newer commit makes an older
# one's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `npm ci`, not `bun install`: package-lock.json is the lockfile that is
      # actually committed, so this is the install path that matches the repo.
      # (bun.lock exists locally but is untracked — do not switch CI to bun
      # without committing a bun.lock in the same change.) Deliberately root
      # ONLY: the framework gate below composes the struct legs at their
      # capability boundaries exactly as today's green runs do — a resvg-less
      # raster leg is a named capability SKIP, not a silent pass. The raster
      # gate currently REFUSES public/favicon.svg (a 310-byte flat-color
      # render against the 512-byte floor) wherever eyestruct's deps ARE
      # installed; that finding goes red WITH its own threshold receipt, not
      # procedure-to-green overnight.
      - name: Install dependencies
        run: npm ci

      # Three passes: src, the Pages Functions (strict), and the test suite
      # (strict). See tsconfig.functions.json / tsconfig.test.json for why the
      # latter two cannot simply be folded into the root config.
      # Birth gate (the flowforge#5 reference implementation): every
      # committed workflow parses with a real YAML parser (the
      # zero-check-run startup-death class), every staging mount is
      # declared independent of the host linter, and every git-dir serde
      # script disables background gc before writing. Cheap, fail-fast,
      # real-parser-backed - see scripts/birth-gate.mjs.
      - name: Birth gate (workflow syntax + mount independence + gc-safe serde)
        run: node scripts/birth-gate.mjs

      # Phased transport-lands gate (scripts/verify-transport-lands.mjs):
      # every byte-carry shape this repo tracks (chunk.*.part families,
      # *.gz.b64 payloads, plain .b64 wrappers) still decodes its declared
      # shape (phase 1) and matches git HEAD with no uncommitted overwrite
      # (phase 2). This is the structural fix for the 2026-10-27 chunk-drift
      # class — a mid-payload transcription error is refused before it can
      # land, not discovered by hand-diffing afterwards. Phase 3 (origin
      # read-back parity) is the pre-push leg and stays local by design.
      - name: Transport lands gate (shape + parity)
        run: node scripts/verify-transport-lands.mjs

      - name: Typecheck
        run: bun run typecheck

      # The high-value rule subset (unused vars, react-hooks, no-undef) plus the
      # English-only prose gate and the docs consistency gate. Warnings do not
      # gate: the three react-refresh warnings on view-state.tsx are the
      # intentional provider+hooks export pattern.
      - name: Lint
        run: bun run lint

      # The real Pages Functions against real SQLite — no Cloudflare account and
      # no network needed. This is what catches a broken guard or merge rule.
      - name: Sync smoke test
        run: bun run sync:smoke

      # Builds a throwaway database from the full migration history. Fails if a
      # migration file was edited after being applied, or if the flattened
      # schema.sql has drifted away from migrations/.
      - name: Migration history check
        run: bun run db:migrate:check

      # Runs the maintenance script's own SQL against an in-memory database —
      # it checks itself. Proves the DELETEs prune what they claim, keep every
      # chain's newest snapshot, and never leak across chains. The daily
      # maintenance workflow re-runs this before touching the real database.
      - name: Maintenance SQL check
        run: bun run db:maintain:check

      # The adversarial campaign (crashtest, from npm) over the four relay
      # routes: builds the handlers bundle, fires every pack (sync-relay-shapes
      # plus the library) against the harness in-process, and FAILS on any new
      # EXPLOITED finding or a regression of a previously REFUSED row. Verdicts
      # live in labs/crashledger.json, so this also keeps the committed
      # baseline honest. No account, no network, no sockets.
      - name: Crashtest campaign (sync-relay-shapes)
        run: bun run crashtest:run

      # packstruct --deep: manifest + entry ship check, import + default-export
      # probe, and the attack-id census over packs/. Same exact-pin lane the
      # crashtest repo runs over its own packs (family convention; catches
      # manifest drift, e.g. a renamed entry, before any run).
      - name: Pack spec lint (packstruct)
        run: npm run lint:packs

      # The full prestruct pipeline via the npm engine: vite build → inject
      # brand meta → prerender the lander and legal pages to per-route HTML
      # (plus sitemap.xml and 404.html). The CLI fails the build when a route
      # fails to render, so this gate proves the whole pipeline ran.
      - name: Production build (prestruct pipeline)
        run: npx prestruct build

      - name: Prerendered pages exist
        run: |
          test -f dist/index.html
          test -f dist/terms/index.html
          test -f dist/privacy/index.html
          test -f dist/sitemap.xml
          test -f dist/404.html
          grep -q 'data-server-rendered="true"' dist/index.html
          echo "Prerendered pages verified."

      # The struct-family framework gate, gistory as integration host: the
      # TEXT leg (poststruct audits the baked HTML that just prerendered),
      # EYES-ART (eyestruct raster-gates the horcrux stones + favicon),
      # TEXT-REF (poststruct's eyes-reference pack: og:image must be REAL
      # pixels - exact dims vs declared, magic bytes, and SVG refs route
      # back through the eyestruct raster gate), and EYES-MEM (the
      # committed labs/.eyes/ ledger: 0 unexplained drift, all rows
      # explained). Family exit contract; skips are NAMED, never fake
      # passes.
      - name: Checkout eyestruct upstream (the EYES legs' tool of record)
        uses: actions/checkout@v4
        with:
          repository: dhaupin/eyestruct
          # eyestruct's check-trifecta verifies cited receipts with
          # git cat-file INSIDE this checkout; a shallow fetch-depth 1
          # clone reports real upstream commit ids as GHOST_COMMIT, so the
          # battery needs the history, not just the tree.
          fetch-depth: 0
          path: eyestruct-upstream

      - name: Install eyestruct upstream
        run: npm ci --prefix eyestruct-upstream

      - name: Framework gate (poststruct x eyestruct legs)
        env:
          EYESTRUCT_BIN: eyestruct-upstream/bin/eyestruct.js
          # The eyestruct-shapes pack's canon leg is the tree of record: the
          # same upstream checkout (retirement budget = eyestruct-staging
          # mount is gone since 2026-10-27, so the old sibling default no
          # longer resolves and the pack would docket a BOUNDED canon-absent
          # row the ledger reads as NEW). Absolute on purpose: the pack
          # runner resolves the knob from ITS OWN cwd (poststruct-staging/),
          # so a repo-relative value misses (run 40658890651 receipt).
          EYESTRUCT_TREE: ${{ github.workspace }}/eyestruct-upstream
        run: node scripts/framework-gate.mjs

  # The staging repos are writing repos of their own — they tar over to
  # dhaupin/poststruct, while eyestruct graduated upstream outright — and
  # this job is where the batteries prove their loaders/packs/ledgers stay
  # conformant with the packstruct spec all family legs share. Separate
  # job, by receipt: the raster gate refuses public/favicon.svg (310-byte
  # flat-color render against the 512-byte floor) wherever eyestruct deps
  # are installed, so this job installs them deliberately and scopes
  # itself to receipt-backed truths (loaders, packs, docs gates, smoke).
  # Honest centerpiece: failures fail under their own name, and the
  # framework gate in verify keeps its capability boundary until the raster
  # threshold has one.
  staging-hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Eyestruct: upstream repo (the staging mount retired 2026-10-27).
      # fetch-depth 0 for the same receipt-HISTORY reason as the verify
      # job's checkout above; a shallow clone makes the trifecta lie.
      - uses: actions/checkout@v4
        with:
          repository: dhaupin/eyestruct
          fetch-depth: 0
          path: eyestruct-upstream

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (poststruct staging + eyestruct upstream)
        run: |
          npm ci --prefix poststruct-staging
          npm ci --prefix eyestruct-upstream

      - name: Poststruct battery (test + lint:packs + conform:packs)
        env:
          EYESTRUCT_BIN: eyestruct-upstream/bin/eyestruct.js
        run: npm run check --prefix poststruct-staging

      - name: Eyestruct smoke (node:test spine, upstream)
        run: npm test --prefix eyestruct-upstream

      - name: Eyestruct battery (docs gates + packs + lint:packs + conform:packs, upstream)
        run: npm run check --prefix eyestruct-upstream

      - name: "Monoforge battery (self-test: stamp + doctor + lock refusals)"
        run: node test/run.mjs
        working-directory: monoforge-staging
