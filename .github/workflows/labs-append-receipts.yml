# ONE-SHOT (retires after its receipt): appends the labs/TASKS.md repair-lane
# receipt runner-side (base body comes from the checked-out tree at origin
# tip - zero carried content; the appendix is a heredoc) and blob-gates the
# result against the local target e3493b64. Same repair shape that landed
# package.json + docs.yml + the transport.md word fix.
name: labs-append-receipts
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append the TASKS receipt + blob-gate the result
        run: |
          set -euo pipefail
          f="labs/TASKS.md"
          got_before="$(git hash-object "$f")"
          if [ "$got_before" != "a13714f4c8ee7e9282fadd4aede8ac5d065dbe08" ]; then
            echo "BASE UNEXPECTED: TASKS.md at tip is $got_before (wanted pre-receipt base a13714f); refusing"
            exit 1
          fi
          cat >> "$f" <<'EOF'
          - **Fourth pass, same day (the repair-lane receipt, 2026-10-28):** the
            gistory#23 transcription class (package.json + docs.yml drifted across
            three commit-lane carries) got its own correction lane and it now has
            its receipt: `poststruct-rig-gates-repair.yml` re-derived both files
            runner-side from the pre-drift rev b4fdf3a via rehearsed transforms and
            blob-gated the outputs (3d04c42d / 00a18f12) before committing
            (repair commit cd2316c). Dispatch 1 died at the depth=1 checkout
            (shallow law proven on a runner: old revs need `fetch-depth: 0`);
            dispatch 2 died at the YAML block-scalar indent (the runner receives
            `run: |` minus its base column). The one-shot retires from the board
            now - the shape is documented in labs/transport.md, so the NEXT drift
            of a gate-chain file is a re-derive + blob gate, never a fourth
            hand-carry.
          EOF
          got="$(git hash-object "$f")"
          if [ "$got" != "e3493b64de0c54879bbd3b7a0b399249cfe91ed4" ]; then
            echo "GATE FAIL: TASKS.md append produced $got != local target e3493b64"
            exit 1
          fi
          echo "gate: TASKS.md now equals the local target (e3493b64)"

      - name: Commit the whitelisted receipt
        run: |
          set -euo pipefail
          git config user.name Codebuff
          git config user.email noreply@codebuff.com
          git add labs/TASKS.md
          git status --porcelain > /tmp/changes.txt
          bad="$(grep -Ev '^(M |A )' /tmp/changes.txt || true)"
          if [ -n "$bad" ]; then echo "UNEXPECTED WORKTREE STATE; refusing:"; echo "$bad"; exit 1; fi
          git commit -m "receipts: the repair-lane entry in labs/TASKS.md (runner-side heredoc append, blob-gated e3493b64)"
          git push
          echo "receipt landed"
