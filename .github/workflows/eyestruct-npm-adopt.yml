# One-shot: eyestruct goes npm - the exact pins + derived lockfiles.
# eyestruct@0.9.0 published on npm; the devDependency pin lands in both
# package.jsons (root + poststruct-staging) as a hand-carried heredoc here
# (their bytes are the contract), while the LOCKFILES are never
# hand-carried - they are derived on the runner by
# `npm install --package-lock-only`, grinned on the exact pin, npm ci
# proven in both trees, then committed atomically so no CI run ever sees a
# package.json/lock disagreement. Idempotent: a re-dispatch finds nothing
# to commit (the pins are already the recorded bytes).
name: eyestruct npm adopt (the exact pins + derived lockfiles)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eyestruct-npm-adopt
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Land the two package.jsons (the EXACT eyestruct pin)
        run: |
          set -euo pipefail
          mkdir -p /tmp/npm-adopt
          cat > /tmp/npm-adopt/root-package.json <<'PKG'
{
  "name": "gistory-sync",
  "private": false,
  "version": "0.9.0",
  "description": "E2EE multi-device sync engine for prompt libraries: agent crypto, merge rules (LWW + tombstones), QoS scheduling, and the storage seam — the same code the app and its service worker run.",
  "license": "MIT",
  "type": "module",
  "homepage": "https://gistory.creadev.org",
  "repository": {
    "type": "git",
    "url": "git+https://github.com/dhaupin/gistory.git"
  },
  "bugs": "https://github.com/dhaupin/gistory/issues",
  "keywords": [
    "prompts",
    "sync",
    "e2ee",
    "encryption",
    "offline-first",
    "local-first",
    "prompt-manager",
    "cloudflare-pages",
    "aes-gcm",
    "multi-device"
  ],
  "main": "dist/lib/index.mjs",
  "types": "dist/lib/index.d.ts",
  "exports": {
    ".": {
      "types": "./dist/lib/index.d.ts",
      "default": "./dist/lib/index.mjs"
    },
    "./package.json": "./package.json"
  },
  "files": [
    "dist/lib",
    "LICENSE",
    "README.md",
    "CHANGELOG.md"
  ],
  "engines": {
    "node": ">=18"
  },
  "//dependencies": "NONE — the published bundle is self-contained ESM. The app's UI deps (react, react-dom, react-router-dom, lucide-react, qrcode.react) live in devDependencies: the Pages/CF build and CI install dev deps too, and keeping them out of dependencies keeps `npm install gistory-sync` free of a React tree it never uses.",
  "devDependencies": {
    "@eslint/js": "^9.17.0",
    "@resvg/resvg-js": "^2.6.2",
    "@types/bun": "^1.4.2",
    "@types/react": "^19.0.6",
    "@types/react-dom": "^19.0.3",
    "@vitejs/plugin-react": "^4.3.4",
    "crashtest": "^1.1.0",
    "eslint": "^9.17.0",
    "eslint-plugin-react-hooks": "^5.0.0",
    "eslint-plugin-react-refresh": "^0.4.16",
    "eyestruct": "0.9.0",
    "freestruct": "^1.1.0",
    "globals": "^15.14.0",
    "lucide-react": "^1.17.0",
    "packstruct": "1.0.0",
    "prestruct": "^1.1.0",
    "puppeteer": "^25.12.0",
    "qrcode.react": "^4.2.0",
    "react": "^19.0.0",
    "react-dom": "^19.0.0",
    "react-router-dom": "^7.18.4",
    "typescript": "~5.6.2",
    "typescript-eslint": "^8.18.2",
    "vite": "^6.0.5"
  },
  "scripts": {
    "dev": "vite",
    "build": "tsc -b && prestruct build && node scripts/build-sw.mjs",
    "build:lib": "node scripts/build-lib.mjs && tsc -p tsconfig.lib.json",
    "build:og": "node scripts/build-og.mjs",
    "typecheck": "tsc -b --noEmit && tsc -p tsconfig.functions.json && tsc -p tsconfig.test.json",
    "lint": "npm run lint:eslint && npm run lint:language && npm run lint:docs",
    "lint:docs": "node scripts/check-docs.mjs",
    "lint:packs": "packstruct lint packs --deep",
    "lint:eslint": "eslint .",
    "lint:language": "node scripts/check-language.mjs",
    "sync:smoke": "bun tests/sync-smoke.ts",
    "sync:live": "bun scripts/live-sync.mjs",
    "sync:multidev": "bun scripts/live-multidevice.mjs",
    "sync:subscribe": "bun scripts/live-subscribe.mjs",
    "sync:barrage": "bun tests/barrage.ts",
    "crashtest:build": "node scripts/build-crashtest.mjs",
    "crashtest:run": "node scripts/build-crashtest.mjs && crashtest run",
    "framework:gate": "node scripts/framework-gate.mjs",
    "transport:lands": "node scripts/verify-transport-lands.mjs",
    "test:ui": "node tests/ui/run.mjs",
    "ui:audit": "node scripts/ui-audit.mjs",
    "probe:dist": "node scripts/dist-probe.mjs",
    "ui:browsers": "node scripts/ui-browsers.mjs",
    "db:init:local": "npx --yes wrangler d1 execute GISTORY_DB --local --file=schema.sql",
    "db:init:remote": "npx --yes wrangler d1 execute GISTORY_DB --remote --config wrangler.deploy.toml --file=schema.sql",
    "db:migrate:local": "node scripts/db-migrate.mjs --local",
    "db:migrate:remote": "node scripts/db-migrate.mjs --remote",
    "db:migrate:status": "node scripts/db-migrate.mjs --local --status",
    "db:migrate:status:remote": "node scripts/db-migrate.mjs --remote --status",
    "db:migrate:check": "node scripts/db-migrate.mjs --check",
    "db:maintain:local": "node scripts/db-maintain.mjs --local",
    "db:maintain:remote": "node scripts/db-maintain.mjs --remote",
    "db:maintain:check": "node scripts/db-maintain.mjs --check",
    "prepublishOnly": "npm run typecheck && npm run lint && npm run build:lib",
    "preview": "vite preview",
    "icons:adopt": "node scripts/adopt-icons.mjs"
  }
}
PKG
          cp /tmp/npm-adopt/root-package.json package.json
          cat > poststruct-staging/package.json <<'PKG'
{
  "name": "poststruct",
  "version": "0.9.0",
  "description": "Audit what shipped. A zero-dependency CLI that walks baked HTML and verifies head, links, and site hygiene against a contract - FAIL findings exit non-zero so CI gates regressions.",
  "type": "module",
  "license": "SEE LICENSE IN LICENSE",
  "bin": {
    "poststruct": "bin/cli.mjs"
  },
  "exports": {
    ".": "./src/index.mjs",
    "./package.json": "./package.json"
  },
  "files": [
    "bin/",
    "src/",
    "LICENSE"
  ],
  "scripts": {
    "test": "node test/run.mjs && node test/shapes-run.mjs && node --test test/ship-from-download.test.cjs",
    "packs": "node scripts/run-packs.mjs",
    "packs:adopt": "node scripts/run-packs.mjs --adopt",
    "lint:packs": "node bin/cli.mjs lint-packs --deep",
    "conform:packs": "packstruct audit-conformance . --loader \"node scripts/run-packs.mjs {packs}\"",
    "check": "npm run test && npm run lint:packs && npm run conform:packs && npm run lint:docs",
    "site:build": "npm --prefix web run build && rm -rf dist && mkdir dist && cp -r web/dist/. dist/",
    "site:dev": "npm --prefix web run dev",
    "icons:adopt": "node scripts/adopt-icons.mjs",
    "lint:docs": "node scripts/check-docs-frontmatter.cjs && node scripts/check-docs-links.cjs && node scripts/check-docs-style.cjs && node scripts/check-fiction-signatures.cjs && node scripts/check-jekyll-filters.cjs && node scripts/check-language.cjs"
  },
  "devDependencies": {
    "eyestruct": "0.9.0",
    "packstruct": "1.0.0"
  },
  "engines": {
    "node": ">=20"
  },
  "keywords": [
    "seo",
    "audit",
    "ci",
    "open-graph",
    "json-ld",
    "sitemap",
    "robots",
    "static-site",
    "prestruct",
    "freestruct",
    "prerender"
  ],
  "repository": {
    "type": "git",
    "url": "git+https://github.com/dhaupin/poststruct.git"
  },
  "bugs": {
    "url": "https://github.com/dhaupin/poststruct/issues"
  },
  "homepage": "https://github.com/dhaupin/poststruct#readme"
}
PKG
          echo "both package.jsons carried" 

      - name: Derive the lockfiles + prove the trees install
        run: |
          set -euo pipefail
          npm install --package-lock-only --no-audit --no-fund
          npm install --package-lock-only --no-audit --no-fund --prefix poststruct-staging
          node - <<'JS'
          const fs = require('fs')
          for (const p of ['package-lock.json', 'poststruct-staging/package-lock.json']) {
            const lock = JSON.parse(fs.readFileSync(p, 'utf8'))
            const want = lock.packages && lock.packages['node_modules/eyestruct']
            if (!want || want.version !== '0.9.0') {
              console.error(p + ': eyestruct@0.9.0 not pinned in the derived lock')
              process.exit(1)
            }
            console.log(p + ': eyestruct@' + want.version + ' pinned')
          }
          JS
          npm ci --no-audit --no-fund --ignore-scripts
          npm ci --no-audit --no-fund --ignore-scripts --prefix poststruct-staging
          echo "both trees install clean from the derived locks"

      - name: Commit (atomic: package.jsons + lockfiles)
        run: |
          set -euo pipefail
          git add package.json package-lock.json poststruct-staging/package.json poststruct-staging/package-lock.json
          if git diff --cached --quiet; then echo 'nothing to land (one-shot already done)'; exit 0; fi
          git config user.name Codebuff
          git config user.email noreply@codebuff.com
          git commit -m "eyestruct@npm: the exact pins land with the derived lockfiles" \
                     -m "eyestruct@0.9.0 is on npm. The devDependency pin is EXACT (the packstruct discipline) in both package.jsons; the lockfiles are derived on the runner (never hand-carried), gated on the pin, and both trees are npm-ci proven before the atomic commit. No lock/package disagreement ever hits CI."
          git push origin main