# One-shot: eyestruct goes npm - the exact pins + derived lockfiles.
# eyestruct@0.9.0 published on npm; the devDependency pin lands in both
# package.jsons (root + poststruct-staging) carried as single-line base64
# printf here (their exact bytes, decoded on the runner), while the
# LOCKFILES are never hand-carried - they are derived by
# `npm install --package-lock-only`, gated on the exact pin, npm ci
# proven in both trees, then committed atomically so no CI run ever sees
# a package.json/lock disagreement. Idempotent: a re-dispatch finds
# nothing to commit (the pins are already the recorded bytes).
name: eyestruct npm adopt (the exact pins + derived lockfiles)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eyestruct-npm-adopt
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Land the two package.jsons (the EXACT eyestruct pin)
        run: |
          set -euo pipefail
          printf %s '' | base64 -d > package.json
          printf %s '' | base64 -d > poststruct-staging/package.json
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('poststruct-staging/package.json','utf8')); console.log('both package.jsons carried and parse')"

      - name: Derive the lockfiles + prove the trees install
        run: |
          set -euo pipefail
          npm install --package-lock-only --no-audit --no-fund
          npm install --package-lock-only --no-audit --no-fund --prefix poststruct-staging
          node - <<'JS'
          const fs = require('fs')
          for (const p of ['package-lock.json', 'poststruct-staging/package-lock.json']) {
            const lock = JSON.parse(fs.readFileSync(p, 'utf8'))
            const want = lock.packages && lock.packages['node_modules/eyestruct']
            if (!want || want.version !== '0.9.0') {
              console.error(p + ': eyestruct@0.9.0 not pinned in the derived lock')
              process.exit(1)
            }
            console.log(p + ': eyestruct@' + want.version + ' pinned')
          }
          JS
          npm ci --no-audit --no-fund --ignore-scripts
          npm ci --no-audit --no-fund --ignore-scripts --prefix poststruct-staging
          echo "both trees install clean from the derived locks"

      - name: "Commit (atomic: package.jsons + lockfiles)"
        run: |
          set -euo pipefail
          git add package.json package-lock.json poststruct-staging/package.json poststruct-staging/package-lock.json
          if git diff --cached --quiet; then echo 'nothing to land (one-shot already done)'; exit 0; fi
          git config user.name Codebuff
          git config user.email noreply@codebuff.com
          git commit -m "eyestruct@npm: the exact pins land with the derived lockfiles" -m "eyestruct@0.9.0 is on npm. The devDependency pin is EXACT (the packstruct discipline) in both package.jsons; the lockfiles are derived on the runner (never hand-carried), gated on the pin, and both trees are npm-ci proven before the atomic commit. No lock/package disagreement ever hits CI."
          git push origin main