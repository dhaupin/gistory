# ONE-SHOT LANE — delete-me-on-run.
# The eyes-ratify lane exposed a corrupted blob in
# eyestruct-staging/package-lock.json: wrong integrity character on
# lru-cache 7.18.3 (chat-to-API transmission kept dropping single chars
# across three push attempts, each time in a different spot). Rather than
# hand-re-emitting 43KB again, npm regenerates the lock from the registry
# in CI and commits it with real git machinery — canonical bytes by
# construction, no human transcription anywhere in the loop. This lane
# deletes itself in the same push, so it cannot run twice by accident.
name: Repair eyestruct-staging lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate the staging lock from the registry
        run: npm install --prefix eyestruct-staging --package-lock-only --no-audit --no-fund

      - name: Commit the canonical lock (and remove this lane)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eyestruct-staging/package-lock.json
          git rm -q .github/workflows/fix-staging-lock.yml
          git commit -q -m "build: regenerate eyestruct-staging lock via npm" -m "The committed blob carried a wrong integrity character (lru-cache 7.18.3, '+3NMM5' where the registry has '+3NNM5'), so every later npm ci died on EINTEGRITY. npm install --package-lock-only rebuilds the lock from the registry. The one-shot repair lane removes itself in the same push."
          git push
