# ONE-SHOT: byte-repair the landed monoforge-ferry.yml.
# The text lane's b64 carry corrupted the same 3-byte group twice
# (offset 8773..8776: "ane" -> "and" / "oad" inside the sweep step's
# commit message). No payload rides this workflow: it flips the group
# runner-side from HEAD's own bytes and sha-gates the result against
# the locally rehearsed draft before committing. The carry lane itself
# never gets to be trusted again for this file.
name: ferry byte repair

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

concurrency:
  group: ferry-byte-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flip the corrupted byte group + sha-gate the result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          path = ".github/workflows/monoforge-ferry.yml"
          data = open(path, "rb").read()
          if len(data) != 8956:
              print("unexpected length:", len(data)); exit(1)
          group = data[8773:8776]
          print("current group:", group)
          if group == b"ane":
              print("already repaired; nothing to do")
              exit(0)
          if group not in (b"and", b"oad"):
              print("unexpected corruption shape; refusing blind write:", group)
              exit(1)
          fixed = data[:8773] + b"ane" + data[8776:]
          want = "eea88fa07c339f56e4c47fc174af69464d4fac54232a4452412e0d55fef35120"
          got = hashlib.sha256(fixed).hexdigest()
          print("sha after flip:", got)
          if got != want:
              print("SHA GATE FAIL: flip did not reconstruct the verified draft"); exit(1)
          open(path, "wb").write(fixed)
          print("BYTE REPAIR OK: group restored, result matches the verified draft byte-exact")
          PV
          PY