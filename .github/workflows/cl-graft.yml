name: cl-graft
# One-shot, dispatch-only: repairs CHANGELOG.md from two verified
# sources - the intact 2697-byte prefix rides from history (98fac3d)
# and only the short 382-byte tail carries (as hex, immune to quote
# mangling). Blob-gates on the disk shade BEFORE writing. Cleanup rides
# the commit lane afterwards.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  graft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Graft prefix + hex tail, blob-gate, commit
        run: |
          git show 98fac3df3ee585a927caf3b72846d1723cb4ac69:CHANGELOG.md | head -c 2697 > /tmp/out.md
          python3 -c "import sys; open('/tmp/out.md','ab').write(bytes.fromhex(''))"
          BLOB=$(git hash-object /tmp/out.md)
          echo "grafted blob: $BLOB (target ffc8839df96d9e8c0a3efdb64898703f9e59c705)"
          if [ "$BLOB" != "ffc8839df96d9e8c0a3efdb64898703f9e59c705" ]; then echo "BLOB MISMATCH - refusing to write"; exit 1; fi
          cp /tmp/out.md CHANGELOG.md
          git config user.name  "Codebuff"
          git config user.email "noreply@codebuff.com"
          git add CHANGELOG.md
          git commit -m "changelog: graft the intact history prefix + hex-carried tail (blob gate ffc8839d)"
          git push
          echo "LANDED-OK $(git rev-parse HEAD)"
