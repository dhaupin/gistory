# One-shot transport lane: styles.css (19.3KB) is in the size class that
# corrupted on the utf-8 text lane today, so it rides the canonical
# gz.b64 carrier: decode the chunks, gunzip, sha-gate against the
# offline blob id, install, sweep the carrier. One run, then the lane
# retires through the commit lane. Escape-free by the 2026-10-27 law:
# no backslash-n inside YAML block scalars.
name: mono styles one-shot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the payload (chunked carrier -> decode -> gunzip)
        run: |
          set -euo pipefail
          test -d .cut-tmp/one-shots
          cat .cut-tmp/one-shots/styles-chunk.* | base64 -d | gunzip > /tmp/styles.css
          test -s /tmp/styles.css

      - name: Sha-gate the payload (offline blob id, git hash-object)
        run: |
          set -euo pipefail
          expect="71d131fcc0980eada6140b4a679c86d3687129bd"
          actual="$(git hash-object /tmp/styles.css)"
          echo "expect styles: $expect"
          echo "actual styles: $actual"
          test "$actual" = "$expect" \
            || { echo "GATE FAIL: styles payload did not round-trip; refusing to commit"; exit 1; }
          head -1 /tmp/styles.css

      - name: Install, sweep the carrier, commit
        run: |
          set -euo pipefail
          cp /tmp/styles.css monoforge-staging/web/src/styles.css
          git config user.name  "one-shot transport"
          git config user.email "actions@users.noreply.github.com"
          git add monoforge-staging/web/src/styles.css
          git rm -r -q .cut-tmp/one-shots
          git commit -m "mono styles: the shell-theme header fix lands via the gz.b64 one-shot (sha-gated)" \
                     -m "The 19.3KB text file rides a chunked gz.b64 carrier (decode, gunzip) and is sha-gated against the offline blob id (71d131fc) before anything is committed - the transport shape, not the corrupting hand lane."
          git push origin main
