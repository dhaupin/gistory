# ONE-SHOT: identity emit (issues gistory#12 + #13) - runner-side, zero
# carried plain text. Three byte-gated actions, one commit, then it
# retires through the cleanup commit lane (labs/transport.md law 3):
#   1. APPEND the identity appendix to horcrux/rig-overlay.patch: the five
#      committed gz+b64 chunks reassemble to a tail whose sha must equal
#      c3f8c9a0b8df88bb243f5dcdf0befa8a796f740ba0be1db71a3db1d4b5ea2966,
#      the overlay must begin at d80bfb5e9758ba580127a292f520d2a635dcca6ad
#      7f667ccfbfa83cc62db61d8 and end at 1402f2edac0a3dacb405661d3d3c794f1
#      8d53a0aaa70ec7efa16975ab1d0a446 (pre-gate / post-gate / doubled-
#      append guard in one).
#   2. WRITE the monoforge rig layout from three chunks, gz-crc gate on
#      8f073f529e708605cf835bb6a8b87bfbf9f2fa6c388370311620635a820a0cd3.
#   3. COPY the merged PRD into the mount's labs, blob-gated against the
#      vault copy c7271d205277c2f98d02cec410bab90b99446279 (zero payload
#      bytes - git-history rebuild shape).
name: identity-emit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 1. Overlay identity appendix (append+gates)
        run: |
          set -euo pipefail
          for c in aa ab ac ad ae; do
            cat "mounts/public/monoforge/boot/handoff/identity-tail.$c.part"
          done | base64 -d | gunzip > /tmp/identity-tail.patch
          got=$(sha256sum /tmp/identity-tail.patch | cut -d' ' -f1)
          want=c3f8c9a0b8df88bb243f5dcdf0befa8a796f740ba0be1db71a3db1d4b5ea2966
          if [ "$got" != "$want" ]; then echo "TAIL SHA DRIFT: $got (want $want)"; exit 1; fi
          pre=$(sha256sum horcrux/rig-overlay.patch | cut -d' ' -f1)
          wanpre=d80bfb5e9758ba580127a292f520d2a635dcca6ad7f667ccfbfa83cc62db61d8
          if [ "$pre" != "$wanpre" ]; then echo "OVERLAY PRE-SHA DRIFT: $pre (want $wanpre)"; exit 1; fi
          cat /tmp/identity-tail.patch >> horcrux/rig-overlay.patch
          post=$(sha256sum horcrux/rig-overlay.patch | cut -d' ' -f1)
          wanpost=1402f2edac0a3dacb405661d3d3c794f18d53a0aaa70ec7efa16975ab1d0a446
          if [ "$post" != "$wanpost" ]; then echo "OVERLAY POST-SHA MISMATCH: $post (want $wanpost)"; exit 1; fi
          echo "overlay emit gated: pre ${pre:0:8} -> post ${post:0:8}"

      - name: 2. Monoforge rig layout from chunks (crc-gated)
        run: |
          set -euo pipefail
          for c in aa ab ac; do
            cat "mounts/public/monoforge/boot/handoff/identity-layout.$c.part"
          done | base64 -d | gunzip > /tmp/mf-layout.html
          got=$(sha256sum /tmp/mf-layout.html | cut -d' ' -f1)
          want=f45e5999d458948b81fcfe696fb0a01576d03fc9342f6e120f1aa02f5664bf7a
          if [ "$got" != "$want" ]; then echo "LAYOUT SHA DRIFT: $got (want $want)"; exit 1; fi
          cp /tmp/mf-layout.html monoforge-staging/docs/_layouts/default.html
          echo "layout emit gated: ${got:0:8}"

      - name: 3. Mount PRD copy (blob-gated)
        run: |
          set -euo pipefail
          src=horcrux/prds/prd-monoforge.md
          dst=monoforge-staging/labs/prd-monoforge.md
          want=$(git hash-object "$src")
          if [ "$want" != "c7271d205277c2f98d02cec410bab90b99446279" ]; then
            echo "PRD GATE FAIL: vault blob $want != released c7271d20"; exit 1
          fi
          cp "$src" "$dst"
          got=$(git hash-object "$dst")
          if [ "$got" != "$want" ]; then echo "PRD GATE FAIL: copy $got != source $want"; exit 1; fi
          echo "prd copied byte-exact: blob ${got:0:16}"

      - name: Commit + push (rebase, never force)
        run: |
          set -euo pipefail
          git config user.name  "identity-emit"
          git config user.email "actions@users.noreply.github.com"
          git add horcrux/rig-overlay.patch monoforge-staging/docs/_layouts/default.html monoforge-staging/labs/prd-monoforge.md
          if git diff --cached --quiet; then
            echo "nothing to commit (already landed)"
            exit 0
          fi
          git commit -m "identity: emit the #12+#13 identity pass runner-side (sha-gated)" \
                     -m "Appendix rides horcrux/rig-overlay.patch (pre d80bfb5e / post 1402f2edac0a); monoforge layout f45e5999d458; mount PRD copy c7271d20. All gates in .github/workflows/identity-emit.yml - a drifted byte refused the run instead of shipping."
          git pull --rebase origin main
          git push origin main
