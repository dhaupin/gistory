# Tasks-restore ferry - repairs labs/TASKS.md after a hand-carry garbled it
# (2026-10-28: commit 631afe0 landed 232 placeholder bytes over the 128KB
# rolling log; part-carrying experiments also truncated). The correct shape:
# nothing big ever rides chat. The lane restores the base log from the last
# known-good landing (git show, byte-exact by construction), applies the
# small committed rider patch, and the sha gate refuses to commit unless the
# surgery round-trips to the offline blob id. One-shot: after success the
# committed junk is swept in the same commit; the workflow then no-ops (the
# patch file is gone) until the yml itself is retired.
name: Tasks restore

on:
  push:
    branches: [main]
    paths:
      - ".cut-tmp/task-restore/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tasks-restore-main
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the base log and apply the rider patch
        run: |
          set -euo pipefail
          test -f .cut-tmp/task-restore/rider.diff || { echo 'no rider patch; nothing to do (one-shot already done)'; exit 0; }
          git show b1780adf8f97f4d4dcf980a134c92107c028b555:labs/TASKS.md > labs/TASKS.md
          echo "base blob: $(git hash-object labs/TASKS.md)"
          patch labs/TASKS.md < .cut-tmp/task-restore/rider.diff
          echo "surgery done; $(wc -c < labs/TASKS.md) bytes"

      - name: Sha-gate the restored log (offline blob id)
        if: hashFiles('.cut-tmp/task-restore/rider.diff') != ''
        run: |
          set -euo pipefail
          expect="89079f96f73ae120d4dd1309402bb457b6c63e76"
          actual="$(git hash-object labs/TASKS.md)"
          echo "expect TASKS: $expect"
          echo "actual TASKS: $actual"
          test "$actual" = "$expect" \
            || { echo "GATE FAIL: the restore did not round-trip; refusing to commit"; exit 1; }
          echo "gate: the restored log round-trips; committing"

      - name: Commit the restored log, sweep the lane junk
        run: |
          set -euo pipefail
          test -f .cut-tmp/task-restore/rider.diff || { echo 'nothing to commit'; exit 0; }
          git config user.name  "tasks-restore"
          git config user.email "actions@users.noreply.github.com"
          git add labs/TASKS.md
          git rm -r -q .cut-tmp/task-restore
          git rm -q .cut-tmp/probe-a.txt || true
          git commit -m "tasks: restore labs/TASKS.md byte-exact (git-show base + rider patch, sha-gated 89079f96)"
          git push origin main
