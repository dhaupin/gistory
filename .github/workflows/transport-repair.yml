name: transport-repair
# One-shot, dispatch-only: origin's labs/transport.md rode the commit lane
# with a one-word scramble (TASTS for TASKS, landed blob d8bb5f18 vs disk
# 9a36eeac). The corrective lane carries ZERO file content: the run repairs
# the word from HEAD's own bytes, blob-gates on the known-good disk shade
# BEFORE writing, and only then commits. Workflow-file cleanup rides the
# commit lane afterwards (a run's push may not patch .github/workflows).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair the word from HEAD bytes, blob-gate, commit
        run: |
          git show HEAD:labs/transport.md | sed 's/the TASTS log/the TASKS log/' > /tmp/fixed.md
          if ! grep -q "the TASKS log" /tmp/fixed.md; then
            echo "REPAIR DID NOT APPLY - 'the TASTS log' not found in HEAD bytes"; exit 1
          fi
          BLOB=$(git hash-object /tmp/fixed.md)
          echo "repaired blob: $BLOB (target 9a36eeacddf43ad90990712820db9a652c219f21)"
          if [ "$BLOB" != "9a36eeacddf43ad90990712820db9a652c219f21" ]; then
            echo "BLOB MISMATCH - refusing to write"; exit 1
          fi
          cp /tmp/fixed.md labs/transport.md
          git config user.name  "Codebuff"
          git config user.email "noreply@codebuff.com"
          git add labs/transport.md
          git commit -m "transport: repair the one-word carry drift (TASTS -> TASKS, blob gate 9a36eeac)"
          git push
          echo "LANDED-OK $BLOB"
