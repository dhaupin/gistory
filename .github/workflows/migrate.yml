# Apply D1 migrations to the live Gistory database.
#
# Why this exists: applying migrations by hand needs `wrangler.deploy.toml` plus
# an authenticated Cloudflare session, neither of which is reachable from a
# phone. This runs the same `scripts/db-migrate.mjs --remote` the owner would
# have run, and GitHub's mobile app can trigger it.
#
# Two ways in:
#   • workflow_dispatch — the "Run workflow" button, available in the GitHub
#     mobile app. Defaults to a dry run, so an accidental tap cannot reach prod.
#   • push to main touching migrations/ — applies automatically.
#
# Required secrets. Set them as ENVIRONMENT secrets under `production`
#   (Settings -> Environments -> production -> Environment secrets) rather than
#   repository secrets: this job declares `environment: production`, so
#   environment secrets are readable here and nowhere else — a fork cannot reach
#   them and no other workflow can either. Repository secrets work identically
#   if you prefer them; the names are the same.
#
#   CLOUDFLARE_API_TOKEN      — a Cloudflare API token with Account > D1 Database
#                               > Edit. Scope it to this one account.
#   CLOUDFLARE_ACCOUNT_ID     — the account holding the D1 database.
#   CLOUDFLARE_D1_DATABASE_ID — the id from `wrangler d1 create gistory`.
#
# Nothing here is ever committed: GitHub stores these encrypted and exposes them
# only to a run, and the database id is written into the gitignored
# `wrangler.deploy.toml` at run time.
#
# These are the only three. The passphrase is never involved: the server is a
# blind relay holding only AES-GCM ciphertext.
#
# Safety properties, all deliberate:
#   • `verify` runs in THIS workflow, not ci.yml. A GitHub Actions job cannot
#     `needs:` a job in another workflow file, so the gate is repeated here on
#     purpose rather than skipped or replaced with a weaker one. The cost is a
#     few duplicated minutes on a migration commit.
#   • `environment: production` — lets you add required reviewers or a wait
#     timer in the environment settings. That is the real safety valve here.
#   • `concurrency` — two runs queue instead of racing.
#   • The runner is idempotent and refuses to proceed if a migration that was
#     already applied has since changed, so a re-run is safe and a bad edit
#     stops the run instead of corrupting the ledger.

name: Migrate D1

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only — do not write to the database"
        type: boolean
        default: true
  push:
    branches: [main]
    # Deliberately NOT path-filtered.
    #
    # The obvious design is `paths: [migrations/**]`, so unrelated commits do
    # not start a production job. It was like that, and it is wrong for how this
    # is actually used: the migrations were committed first and the secrets
    # added afterwards, so nothing ever applied them. Any push to main was
    # expected to catch up the schema, and the path filter meant it silently did
    # not — the failure mode is a chain that stays broken with no signal.
    #
    # The cost of dropping it is one short CI run per push that finds nothing
    # pending, which is bounded by `concurrency` and gated by `needs: verify`.
    # `scripts/db-migrate.mjs` is idempotent and applies only what is pending,
    # so an unrelated push is a no-op rather than a risk.

concurrency:
  group: migrate-d1
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: bun run typecheck
      - name: Sync smoke test
        run: bun run sync:smoke
      - name: Migration history check
        run: bun run db:migrate:check

  migrate:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    # Job-level, not step-level. Wrangler is invoked by the steps below, not by
    # the step that writes the config, so the token has to be in the
    # environment of every step that shells out to it. Scoping it to the
    # configure step alone passes that step and then fails at the first real
    # wrangler call with "it's necessary to set a CLOUDFLARE_API_TOKEN
    # environment variable" — which is exactly how this went wrong first time.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Configure wrangler
        run: |
          set -eu
          # Fail fast, and loudly, if the secrets are not actually present —
          # otherwise the first wrangler call fails with a much less obvious
          # "you must set CLOUDFLARE_API_TOKEN" message.
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it as an environment secret under 'production'."; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set."; exit 1; }
          test -n "${D1_DATABASE_ID}" || { echo "::error::CLOUDFLARE_D1_DATABASE_ID is not set."; exit 1; }

          # A D1 database id is a UUID. If this is wrong, Cloudflare answers
          # "Invalid property: databaseId => Invalid uuid [code: 7400]", which
          # says nothing about where the wrong value came from. The usual cause
          # is pasting the database *name* ("gistory") or the binding name
          # (GISTRY_DB) instead of the id from the D1 dashboard. Checked here so
          # the message can actually name the problem. The value is never echoed.
          if ! printf '%s' "${D1_DATABASE_ID}" | grep -qiE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::CLOUDFLARE_D1_DATABASE_ID is not a D1 database id (expected a UUID like 00000000-0000-0000-0000-000000000000)."
            echo "::error::Use the 'Database ID' from Cloudflare dashboard -> Workers & Pages -> D1 -> your database. It is not the database name ('gistory') and not the binding name ('GISTRY_DB')."
            exit 1
          fi

          # wrangler.deploy.toml is gitignored on purpose — the real
          # database_id must never be committed. Recreate it from secrets.
          cp wrangler.deploy.example.toml wrangler.deploy.toml
          # The example ends with a placeholder line; replace it rather than
          # appending, so wrangler never sees two database_id keys.
          sed -i.bak "s|^database_id = .*|database_id = \"${D1_DATABASE_ID}\"|" wrangler.deploy.toml
          rm -f wrangler.deploy.toml.bak
          echo "Wrangler configured (database id redacted)."

      # Read this line first when a run fails: it lists which migrations the
      # database already has.
      #
      # Wrapped so a Cloudflare API error is translated. The raw codes are
      # accurate and unhelpful: 7403 in particular covers both "the account id
      # is wrong" and "the token cannot reach that account", and nothing in the
      # raw message distinguishes them.
      - name: Show current migration status
        run: |
          set +e
          out="$(bun run db:migrate:status:remote 2>&1)"
          code=$?
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            case "$out" in
              *7403*)
                echo "::error::Cloudflare rejected the account (code 7403). One of two things is wrong, and the API message does not say which:"
                echo "::error::  (a) CLOUDFLARE_ACCOUNT_ID is not the account that owns the database. It is the 32-character hex in the dashboard URL: dashboard.cloudflare.com/<ACCOUNT_ID>/"
                echo "::error::  (b) CLOUDFLARE_API_TOKEN cannot access that account. Re-create the token with permissions Account > D1 Database > Edit, scoped to exactly that account — not a template token, and not 'All accounts'."
                ;;
              *7400*)
                echo "::error::Cloudflare rejected CLOUDFLARE_D1_DATABASE_ID (code 7400). It must be the Database ID from D1, and it must live in the same account as CLOUDFLARE_ACCOUNT_ID."
                ;;
              *10000*|*"Authentication error"*)
                echo "::error::Cloudflare rejected the API token itself. Check it has not expired and has not been revoked."
                ;;
            esac
          fi
          exit "$code"

      - name: Dry run — no changes written
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "::notice title=Dry run::Nothing was written. Re-run with dry_run"
          echo "::notice::disabled to apply. Pending migrations are listed above."

      - name: Apply pending migrations
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: bun run db:migrate:remote

      - name: Confirm the schema still builds from scratch
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: bun run db:migrate:check