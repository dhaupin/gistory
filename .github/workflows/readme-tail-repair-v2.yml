# Readme tail repair v2 - the reconstruct-from-history one-shot.
#
# The poststruct README tail was destroyed by malformed transport b64
# (804e9bfb is a 1983-byte file with a garbage tail). Attempts to re-ride
# the tail as one committed payload kept landing one wrong byte group at a
# time, so this lane takes bytes the repo ALREADY HAS: blob e2568de0 (the
# repair-2 landing: valid utf-8, only its four markdown links dropped) is
# pulled from git history, six tiny utf-8 pairs re-plant the link
# fragments, and the assembly is sha-gated against the offline target
# (3d503cee) before any commit. A wrong pair = gate fail = nothing lands.
# After success the lane no-ops on re-dispatch (the gate bites at the
# base step: no historical blob rebuilt twice, drift already retired).
name: readme tail repair v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-tail-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The lane reads a blob from GITHUB HISTORY (e2568de0), so a
          # shallow checkout cannot serve the first cat-file run 1 proved
          # that the hard way: 'bad file' before the sha gate even started.
          fetch-depth: 0

      - name: Rebuild the README from the historical blob + six link re-plants
        run: |
          set -euo pipefail
          git cat-file blob e2568de038e6d3ce43531ec44a2d86e46854b446 > /tmp/readme-base.md
          python3 - <<'PY'
          import pathlib, subprocess, sys
          p = pathlib.Path('/tmp/readme-base.md')
          raw = p.read_bytes()
          pairs = [
              (bytes([112, 97, 99, 107, 115, 116, 114, 117, 99, 116, 32, 83, 80, 69, 67, 32, 118, 49]),
               b'[packstruct](https://github.com/dhaupin/packstruct) SPEC v1'),
              (bytes([10, 68, 69, 80, 76, 79, 89, 46, 109, 100, 46, 10]),
               b'\n[DEPLOY.md](DEPLOY.md).\n'),
              (bytes([10, 45, 32, 112, 114, 101, 115, 116, 114, 117, 99, 116, 32, 45, 32, 115]),
               b'\n- [prestruct](https://github.com/dhaupin/prestruct) - s'),
              (bytes([10, 45, 32, 102, 114, 101, 101, 115, 116, 114, 117, 99, 116, 32, 45, 32]),
               b'\n- [freestruct](https://github.com/dhaupin/freestruct) - '),
              (bytes([10, 45, 32, 99, 114, 97, 115, 104, 116, 101, 115, 116, 32]),
               b'\n- [crashtest](https://github.com/dhaupin/crashtest) '),
              (bytes([10, 45, 32, 112, 97, 99, 107, 115, 116, 114, 117, 99, 116, 32, 45, 32]),
               b'\n- [packstruct](https://github.com/dhaupin/packstruct) - '),
          ]
          for old, new in pairs:
              if raw.count(old) == 0:
                  print('repair pair not found in the base:', old[:40]); sys.exit(1)
              raw = raw.replace(old, new, 1)
          open('poststruct-staging/README.md', 'wb').write(raw)
          h = subprocess.run(['git', 'hash-object', 'poststruct-staging/README.md'], capture_output=True, text=True).stdout.strip()
          print('assembled blob:', h)
          expect = '3d503ceec768ef49ee22e12279ddaba1b3f35b29'
          if h != expect:
              print('GATE FAIL: assembled blob != offline target; refusing to commit'); sys.exit(1)
          print('gate: the reconstruction round-trips; committing')
          PY

      - name: Commit the repaired file
        run: |
          set -euo pipefail
          git config user.name  "readme-repair-v2"
          git config user.email "actions@users.noreply.github.com"
          git add poststruct-staging/README.md
          git commit -m "readme: rebuild the poststruct tail from history + six link re-plants (sha-gated vs 3d503cee)" \\
                     -m "The blob rides reconstruction, not transport: base = e2568de0 from commit e15a48f5, six tiny pair re-plants restore the dropped markdown links, and the assembled file is gated against the offline blob id before commit."
          git push origin main
