# ONE-SHOT REPAIR: re-derive poststruct-staging/package.json + docs.yml from
# the PRE-DRIFT blob (b4fdf3a) via the rehearsed transforms and blob-gate
# both against the local targets - the commit-lane transcription class got
# its own correction lane (labs/transport.md). Retires after receipts.
name: poststruct-rig-gates-repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git show b4fdf3a needs the history; depth=1 cannot see the pre-drift rev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-derive package.json (the rehearsed edit on the b4fdf3a bytes)
        run: |
          set -euo pipefail
          git show b4fdf3a58b2d9cf73791e031d8510bbbd60a3ff9:poststruct-staging/package.json > poststruct-staging/package.json
          node - <<'JS'
            const fs = require('fs')
            const p = JSON.parse(fs.readFileSync('poststruct-staging/package.json', 'utf8'))
            p.scripts['lint:docs'] = 'node scripts/check-docs-frontmatter.cjs && node scripts/check-docs-links.cjs && node scripts/check-docs-style.cjs && node scripts/check-fiction-signatures.cjs && node scripts/check-jekyll-filters.cjs && node scripts/check-language.cjs'
            p.scripts.check = 'npm run test && npm run lint:packs && npm run conform:packs && npm run lint:docs'
            fs.writeFileSync('poststruct-staging/package.json', JSON.stringify(p, null, 2) + '\n')
          JS
          got="$(git hash-object poststruct-staging/package.json)"
          if [ "$got" != "3d04c42d45e6409061922603a218d205100e0b3f" ]; then echo "PKG GATE FAIL $got"; exit 1; fi
          echo "package.json: blob gate ok (3d04c42d)"

      - name: Re-derive docs.yml (the rehearsed python delta on the b4fdf3a bytes)
        run: |
          set -euo pipefail
          git show b4fdf3a58b2d9cf73791e031d8510bbbd60a3ff9:poststruct-staging/.github/workflows/docs.yml > poststruct-staging/.github/workflows/docs.yml
          python3 /dev/stdin poststruct-staging/.github/workflows/docs.yml <<'PY'
          import sys
          path = sys.argv[1]
          old = open(path).read()
          marker = '          node scripts/check-language.cjs\n'
          assert old.count(marker) == 1, 'gate chain not in the expected shape'
          old_block = '\n'.join([
            '      # Docs truth gates (ported house checkers): frontmatter 5-field law,',
            '      # resolvable links, style law (no dashes in prose, language-tagged',
            '      # fences, no trailing ws), English-only prose.',
            '      - name: Docs gates',
            '        run: |',
            '          node scripts/check-docs-frontmatter.cjs',
            '          node scripts/check-docs-links.cjs',
            '          node scripts/check-docs-style.cjs',
            '          node scripts/check-language.cjs',
            '',
          ])
          new_block = '\n'.join([
            '      # Docs truth gates (ported house checkers): frontmatter 5-field law,',
            '      # resolvable links, style law (no dashes in prose, language-tagged',
            '      # fences, no trailing ws), fiction-signature + Jekyll-filter trap',
            '      # scanners (the rig-pass generation, gistory#23), English-only prose.',
            '      - name: Docs gates',
            '        run: |',
            '          node scripts/check-docs-frontmatter.cjs',
            '          node scripts/check-docs-links.cjs',
            '          node scripts/check-docs-style.cjs',
            '          node scripts/check-fiction-signatures.cjs',
            '          node scripts/check-jekyll-filters.cjs',
            '          node scripts/check-language.cjs',
            '',
          ])
          assert old.count(old_block) == 1, 'gate block not unique'
          open(path, 'w').write(old.replace(old_block, new_block))
          PY
          got="$(git hash-object poststruct-staging/.github/workflows/docs.yml)"
          if [ "$got" != "00a18f1296b3a7878d6e36b9390e69085e3239ae" ]; then echo "DOCS GATE FAIL $got"; exit 1; fi
          echo "docs.yml: blob gate ok (00a18f12)"

      - name: Commit the whitelisted repair
        run: |
          set -euo pipefail
          git config user.name Codebuff
          git config user.email noreply@codebuff.com
          git add poststruct-staging/package.json poststruct-staging/.github/workflows/docs.yml
          git status --porcelain > /tmp/changes.txt
          bad="$(grep -Ev '^(M |A )' /tmp/changes.txt || true)"
          if [ -n "$bad" ]; then echo "UNEXPECTED WORKTREE STATE; refusing:"; echo "$bad"; exit 1; fi
          git commit -m "gistory#23 repair: package.json + docs.yml re-derived runner-side from the pre-drift blob (b4fdf3a) and blob-gated against the local targets"
          git push
          echo "repair landed"
