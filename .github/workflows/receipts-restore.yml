name: receipts-restore
# One-shot, dispatch-only. Two receipt appendices must land on top of two
# pre-hit TASKS files, but EVERY direct content carry of the 4.2-5.8KB blobs
# arrived at origin truncated (twice, byte-identically - 952 of 4,268 bytes.
# So: the runner rebuilds each base file FROM GIT HISTORY (commit 95ef012,
# the last whole state on main) - zero carried content for the bodies - then
# appends the receipt paragraphs from the heredocs in this workflow, and
# sha256-gates BOTH files against values computed on the healthy local tree
# (d053fe79.. == monoforge, 1f380f27.. == eyestruct). Nothing pushes unless
# both gates pass; a drift aborts loudly without firing either commit or
# push. Line-indented heredocs so the appendix bytes arrive verbatim.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-verify-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild both TASKS files from history + receipt appendices
        run: |
          set -e
          # --- monoforge ---
          git show 95ef012:monoforge-staging/labs/TASKS.md > mono_base.md
          cat >> mono_base.md <<'APPENDIX'
          - **Ferry law, receipts (2026-10-26, evening).** The six template/doc
            repairs that ride INSIDE the lock archive cannot sit in the mount tree
            durably: the ferry ("the mount tool tree matches its lock")
            reassembles them from the archive on every interleaved lane run. The
            fixed bytes + the convergence recipe now ride
            `horcrux/lock-archive-overlay.patch` - a git unified diff against the
            archive bytes, landed through the commit lane in base64 mode (blob
            44a0c4a9), in the ferry-safe horcrux slot until the upstream re-lock
            retires it. Move-day steps live in the patch header: apply it inside
            dhaupin/monoforge (needs the repo's first write grant), rerun the
            self-test battery, cut a fresh lock, and re-pin gistory's ferry to
            that lock; this patch then retires in the same commit the pin moves.
            Three transport teachings landed tonight, recorded for the family:
            (1) a single-line pure base64 carry (9.8KB prose+diff) verified
            blob-exact on the first try - safest text-lane shape found;
            (2) wrapped-row carries still scramble occasionally (one two-row hit
            near row 117 of a 224-row gz+b64 payload), so every carry needs its
            blob id checked BEFORE anything dispatches against it; (3) receipts
            above ~10KB belong to a runner-side emit (payload + one-shot, sha-gated
            from the burn file) rather than a text lane.
          APPENDIX
          MSHA=$(sha256sum mono_base.md | cut -d' ' -f1)
          echo "monoforge sha: $MSHA"
          if [ "$MSHA" != "d053fe799a9012cae1ff87262b94bd70633a8e946cd4fcca9bc38576ce25fc8b" ]; then
            echo "MONOFORGE SHA MISMATCH - aborting without commit"; exit 1; fi
          cp mono_base.md monoforge-staging/labs/TASKS.md
          # --- eyestruct ---
          git show 95ef012:eyestruct-staging/labs/TASKS.md > eyes_base.md
          cat >> eyes_base.md <<'APPENDIX'
          - **Landing pass (2026-10-26, evening) - the lock was the last drift.**
            The web rebrand rode main, but package-lock.json (58.7KB) never
            survived a text-lane carry: one transcription casualty on main (a
            partial `eyestruct-site` with a placeholder blob), reverted runner-side
            by a one-shot (which also taught fetch-depth: 0 - a shallow checkout
            cannot `git checkout <parent> -- path`). Final shape: the lock rode a
            gzip+base64 payload through a runner-side repair+emit one-shot that
            sha-gated f47974f87e152364 and JSON-checked root name `eyestruct-site`
            before writing, then removed its payload; the three one-shot workflows
            (web-lock-restore/emit/repair) were retired through the commit lane
            (commit 59dae63). The repair pass fixed one two-row scramble in its own
            payload near row 117 ("EMNEWAKhs" rode as "EMNEWSAKh" plus a stray
            join), caught by blob-id before any dispatch; and it learned the two
            hard GITHUB_TOKEN rules the hard way: a run cannot hold the
            "workflows" permission scope (the API refuses to even parse the
            workflows key), and a run's push may not patch files under
            .github/workflows - so both workflow cleanups rode the commit lane
            instead. Origin blob == disk blob (3518984fec0d90796a06206a85ff2e92c1
            cf874c): package.json + package-lock.json now agree on the eyestruct
            name, and `npm ci` stays hermetic.
          APPENDIX
          ESHA=$(sha256sum eyes_base.md | cut -d' ' -f1)
          echo "eyestruct sha: $ESHA"
          if [ "$ESHA" != "1f380f27e58a46bc3d5bfb91bbd34067ba14e53b2a4d64ed1bc302b07f153875" ]; then
            echo "EYESTRUCT SHA MISMATCH - aborting without commit"; exit 1; fi
          cp eyes_base.md eyestruct-staging/labs/TASKS.md
          rm mono_base.md eyes_base.md
      - name: Commit restored receipt files
        run: |
          git config user.name "Codebuff"
          git config user.email "noreply@codebuff.com"
          git add monoforge-staging/labs/TASKS.md eyestruct-staging/labs/TASKS.md
          git commit -m "tasks: whole-file receipt restore from history + sha-gated appendices"
          git push
