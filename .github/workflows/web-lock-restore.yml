# One-shot tool - restore eyestruct's web package-lock from its known-good
# blob, undoing the partial-transcription commit that hand-carried a
# TRUNCATED lock (plus a literal PLACEHOLDER tail) through the transport
# lane (commit e8c47fd1, blob 63fa2fbc).
#
# The lock is ~59KB upstream-stable JSON: too big for a hand-carry lane
# (the drift class the receipts prescribe against), so byte surgery is
# done RUNNER-SIDE from git's own objects, exactly like the horcrux-reorg
# pattern: restore the parent-tree bytes, gate the blob id, commit, push.
#
# Target: eyestruct-staging/web/package-lock.json
#   known-good blob: ac9505b6225e1b2562001dec242b368dc3a42695
#   (the pre-rename lock; its root "name" field reads "your-site", which is
#   cosmetic-only - npm ci validates the dep graph, never the root name -
#   so the rename rides a later hermetic regeneration instead of a
#   hand-carry).
#   corrupt  blob: 63fa2fbc9a9ee5bc1a20e4f1f7a8138786b9086c
# Parent commit with the known-good bytes: 9f0b3f2f83f4eecca5ac298ce5279b120cf734fb
#
# Idempotent: if the tree already carries the known-good blob, says so and
# exits 0. The trigger is workflow_dispatch only - this is a tool, not a lane.
name: One-shot web lock restore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore the lock from the parent tree's own bytes
        run: |
          set -euo pipefail
          f=eyestruct-staging/web/package-lock.json
          cur=$(git rev-parse "HEAD:$f")
          if [ "$cur" = "ac9505b6225e1b2562001dec242b368dc3a42695" ]; then
            echo "already the known-good blob ac9505b6; nothing to do"
            exit 0
          fi
          git checkout 9f0b3f2f83f4eecca5ac298ce5279b120cf734fb -- "$f"
          actual=$(git hash-object "$f")
          expect=ac9505b6225e1b2562001dec242b368dc3a42695
          if [ "$actual" != "$expect" ]; then
            echo "GATE FAIL: restored blob $actual != expected $expect; refusing to commit"
            exit 1
          fi
          echo "restored blob verified: $actual"

      - name: Commit the restore
        run: |
          set -euo pipefail
          git config user.name  "web-lock-restore"
          git config user.email "actions@users.noreply.github.com"
          git add eyestruct-staging/web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "eyestruct: web lock restored from its parent-tree blob (ac9505b6) - undo the placeholder-corrupt commit e8c47fd1 (runner-side byte surgery, sha-gated)"
            git push origin main
          else
            echo "nothing to commit"
          fi
