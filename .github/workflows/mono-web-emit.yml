# ONE-SHOT: emit the monoforge web payload files from the handoff parts.
# The 58KB package-lock.json and the rendered PNGs ride gz/base64 parts under
# monoforge-staging/horcrux/handoff/ because text-lane carries of THIS size
# class have corrupted in this family before (labs/transport.md). Each part
# is decoded, sha-gated against the digest below, and written; then committed
# runner-side. The workflow file itself is retired through the commit lane
# after the run (a run cannot patch .github/workflows - see transport.md).
# Delete this file after the receipts verify.
name: mono-web-emit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode, sha-gate, emit
        run: |
          set -euo pipefail
          cul="monoforge-staging/horcrux/handoff"
          web="monoforge-staging/web"
          mkdir -p "$web/public"
          tmp="$(mktemp -d)"

          emit_gz() { # part, target, raw-sha256-of-plain-file
            local p="$1" t="$2" sha="$3"
            base64 --ignore-garbage -d "$cul/$p" > "$tmp/gz"
            python3 - "$cul/$p" "$tmp/gz" "$sha" "$t" <<'PY'
import base64, gzip, hashlib, sys
part, gzf, want, target = sys.argv[1:5]
b = gzip.decompress(open(gzf, 'rb').read())
got = hashlib.sha256(b).hexdigest()
if got != want:
    print(f"SHA GATE FAIL {part}: {got}", file=sys.stderr)
    sys.exit(1)
open(target, 'wb').write(b)
print(f"EMIT OK {target} ({len(b)} bytes) sha {got[:16]}")
PY
          }

          emit_raw() { # part, target, sha256-of-file
            local p="$1" t="$2" sha="$3"
            base64 --ignore-garbage -d "$cul/$p" > "$tmp/out"
            got="$(sha256sum "$tmp/out" | cut -d' ' -f1)"
            if [ "$got" != "$sha" ]; then
              echo "SHA GATE FAIL $p: $got" >&2; exit 1
            fi
            install -m 644 "$tmp/out" "$t"
            echo "EMIT OK $t ($(stat -c%s "$t") bytes) sha ${got:0:16}"
          }

          emit_gz  mono-web-lock.gz.b64      "$web/package-lock.json"        34931ee68ee31740816248a297717912f559206bead4b2df980b69d5aa042dbd
          emit_raw og-image.png.b64          "$web/public/og-image.png"      7fe3cb34ede4b20c19f7fb1d027bc88de1beb1bf2495fd57f3d02ff3d3879a9e
          emit_raw icon-512.png.b64          "$web/public/icon-512.png"      38f9d350585c3701db3250b974e605d1ddd2e9681e8acd6c907a55c768774930
          emit_raw icon-192.png.b64          "$web/public/icon-192.png"      f79dcb2917151aefab7d119dceadbc2bb201133fd5ca20ccf91f76fed2011010
          emit_raw favicon-32.png.b64        "$web/public/favicon-32.png"    733a254fd01c612c1d6685ce17188c87269488664b693089ce15571f75694674
          emit_raw apple-touch-icon.png.b64  "$web/public/apple-touch-icon.png" 54bd65b4afc610267e29d1453ed633a2e3859c1879bfd068b5bf2e80bc674ec1

      - name: JSON sanity on the lock
        run: |
          set -euo pipefail
          name="$(node -e "console.log(JSON.parse(require('fs').readFileSync('monoforge-staging/web/package-lock.json','utf8')).name)")"
          if [ "$name" != "monoforge-site" ]; then echo "LOCK ROOT NAME FAIL: $name"; exit 1; fi
          echo "lock root name: $name"

      - name: Commit emitted files
        run: |
          git config user.name Codebuff
          git config user.email noreply@codebuff.com
          git add monoforge-staging/web
          git commit -m "mono-web-emit: land the web payloads (lock + rendered marks) from sha-gated handoff parts"
          git push
