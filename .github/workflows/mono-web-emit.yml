# STANDING LANE (dispatch to re-bake): emit the monoforge web payload files -
# carrying ZERO payload bytes (labs/transport.md: text-lane carries of this
# size class corrupted twice tonight; hand-echoed base64 drifted twice at
# the blob gate). Instead the runner derives/copies everything from files
# already in the repo:
#   - web engine files + docs-gate scripts <- copied from eyestruct's
#     upstream tree (dhaupin/eyestruct; the gistory staging mount retired
#     2026-10-27; monoforge keeps them byte-identical)
#   - web/package-lock.json <- eyestruct's committed lock + the two name
#     swaps (proven byte-identical harness-side) + sha256 gate
#   - public/*.png + og-image.png <- rendered with @resvg/resvg-js@2.6.2
#     from the committed monoforge SVGs + sha256 gates
# The workflow file itself retires through the commit lane after the run.
name: mono-web-emit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Eyestruct itself: upstream repo (the staging mount retired
      # 2026-10-27). The emit derives everything from its committed tree.
      - uses: actions/checkout@v4
        with:
          repository: dhaupin/eyestruct
          path: eyestruct-upstream

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy the unchanged engine files from eyestruct's committed tree
        run: |
          set -euo pipefail
          mkdir -p monoforge-staging/web/src/hooks monoforge-staging/web/src/pages monoforge-staging/web/src/components monoforge-staging/web/scripts
          for f in \
            src/main.jsx src/App.jsx src/AppLayout.jsx src/AppIslands.jsx src/islands.js \
            src/hooks/usePageMeta.js src/pages/NotFound.jsx src/styles.css vite.config.js \
            scripts/repair-404.cjs public/_headers public/_redirects public/robots.txt \
            .gitignore; do
            mkdir -p "monoforge-staging/web/$(dirname "$f")"
            cp "eyestruct-upstream/web/$f" "monoforge-staging/web/$f"
            echo "copied $f"
          done

      - name: Copy the rig docs-gate scripts from eyestruct's committed tree
        run: |
          set -euo pipefail
          for f in check-docs-frontmatter.cjs check-docs-style.cjs check-fiction-signatures.cjs check-jekyll-filters.cjs; do
            cp "eyestruct-upstream/scripts/$f" "monoforge-staging/scripts/$f"
            echo "copied scripts/$f"
          done
          # the link checker is the one script monoforge rebrands: SITE_PREFIX
          sed "s|const SITE_PREFIX = '/eyestruct';.*|const SITE_PREFIX = '/monoforge'; // the docs baseurl - mirror docs/_config.yml|" \
            eyestruct-upstream/scripts/check-docs-links.cjs \
            > monoforge-staging/scripts/check-docs-links.cjs
          echo "wrote scripts/check-docs-links.cjs with SITE_PREFIX /monoforge"
          cp monoforge-staging/web/public/icon.svg monoforge-staging/docs/icon.svg

      - name: Emit the lock (derived from eyestruct's committed lock, sha-gated)
        run: |
          set -euo pipefail
          mkdir -p monoforge-staging/web/public
          # The monoforge-site lock is byte-identical to eyestruct's committed
          # lock except the two name fields - derived, never carried.
          sed 's/"eyestruct-site"/"monoforge-site"/g' \
            eyestruct-upstream/web/package-lock.json \
            > monoforge-staging/web/package-lock.json
          got="$(sha256sum monoforge-staging/web/package-lock.json | cut -d' ' -f1)"
          want="34931ee68ee31740816248a297717912f559206bead4b2df980b69d5aa042dbd"
          if [ "$got" != "$want" ]; then echo "LOCK SHA GATE FAIL: $got"; exit 1; fi
          name="$(node -e "console.log(JSON.parse(require('fs').readFileSync('monoforge-staging/web/package-lock.json','utf8')).name)")"
          if [ "$name" != "monoforge-site" ]; then echo "LOCK ROOT NAME FAIL: $name"; exit 1; fi
          echo "LOCK EMIT OK name=$name sha ${got:0:16}"

      - name: Render the marks (resvg-js 2.6.2, sha-gated)
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund @resvg/resvg-js@2.6.2 >/dev/null
          node - <<'JS'
          const fs = require('node:fs')
          const { Resvg } = require('@resvg/resvg-js')
          const icon = fs.readFileSync('monoforge-staging/web/public/icon.svg', 'utf8')
          const og = fs.readFileSync('mounts/public/monoforge/boot/handoff/og-image-src.svg', 'utf8')
          const render = (svg, w) => new Resvg(svg, { fitTo: { mode: 'width', value: w } }).render().asPng()
          fs.writeFileSync('monoforge-staging/web/public/og-image.png', render(og, 1200))
          fs.writeFileSync('monoforge-staging/web/public/icon-512.png', render(icon, 512))
          fs.writeFileSync('monoforge-staging/web/public/icon-192.png', render(icon, 192))
          fs.writeFileSync('monoforge-staging/web/public/favicon-32.png', render(icon, 32))
          fs.writeFileSync('monoforge-staging/web/public/apple-touch-icon.png', render(icon, 180))
          console.log('renders complete')
          JS
          check() {
            got="$(sha256sum "$1" | cut -d' ' -f1)"
            if [ "$got" != "$2" ]; then echo "PNG SHA GATE FAIL $1: $got"; exit 1; fi
            echo "RENDER OK $1 sha ${got:0:16}"
          }
          check monoforge-staging/web/public/og-image.png          7fe3cb34ede4b20c19f7fb1d027bc88de1beb1bf2495fd57f3d02ff3d3879a9e
          check monoforge-staging/web/public/icon-512.png          621a72e749afa61ce23089f3156a06da0007c1522e4e1363337bfc9a6f5381f9
          check monoforge-staging/web/public/icon-192.png          b16acd4002d245f0fe6008d10abbb56197b828e18c5d32c756a6af459317283c
          check monoforge-staging/web/public/favicon-32.png        9dc2d6eb2d1bcf76037932c9c93594da9a4faaf9d2ce5da72c0cfb2e5cdaa298
          check monoforge-staging/web/public/apple-touch-icon.png  a5a2821a66118764cedf67d4072fc9fba81d42e41c21606d613ee85ed689b3a7

      - name: Commit emitted files
        run: |
          git config user.name Codebuff
          git config user.email noreply@codebuff.com
          git add monoforge-staging
          git commit -m "mono-web-emit: land the web payloads (lock + rendered marks + copied engine/scripts), derived and sha-gated"
          git push
