# ONE-SHOT: emit the monoforge web payload files - carrying ZERO payload
# bytes (labs/transport.md: text-lane carries of this size class corrupted
# twice tonight; hand-echoed base64 drifted twice at the blob gate). Instead
# the runner derives everything from files already in the repo:
#   - web/package-lock.json  <- eyestruct's committed lock + the two name
#     swaps (proven byte-identical harness-side) + sha256 gate
#   - public/*.png + og-image.png <- rendered with @resvg/resvg-js@2.6.2
#     from the committed monoforge SVGs + sha256 gates
# The workflow file itself retires through the commit lane after the run.
name: mono-web-emit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Emit the lock (derived from eyestruct's committed lock, sha-gated)
        run: |
          set -euo pipefail
          mkdir -p monoforge-staging/web/public
          # The monoforge-site lock is byte-identical to eyestruct's committed
          # lock except the two name fields - derived, never carried.
          sed 's/"eyestruct-site"/"monoforge-site"/g' \
            eyestruct-staging/web/package-lock.json \
            > monoforge-staging/web/package-lock.json
          got="$(sha256sum monoforge-staging/web/package-lock.json | cut -d' ' -f1)"
          want="34931ee68ee31740816248a297717912f559206bead4b2df980b69d5aa042dbd"
          if [ "$got" != "$want" ]; then echo "LOCK SHA GATE FAIL: $got"; exit 1; fi
          name="$(node -e "console.log(JSON.parse(require('fs').readFileSync('monoforge-staging/web/package-lock.json','utf8')).name)")"
          if [ "$name" != "monoforge-site" ]; then echo "LOCK ROOT NAME FAIL: $name"; exit 1; fi
          echo "LOCK EMIT OK name=$name sha ${got:0:16}"

      - name: Render the marks (resvg-js 2.6.2, sha-gated)
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund @resvg/resvg-js@2.6.2 >/dev/null
          node - <<'JS'
          const fs = require('node:fs')
          const { Resvg } = require('@resvg/resvg-js')
          const icon = fs.readFileSync('monoforge-staging/web/public/icon.svg', 'utf8')
          const og = fs.readFileSync('monoforge-staging/horcrux/handoff/og-image-src.svg', 'utf8')
          const render = (svg, w) => new Resvg(svg, { fitTo: { mode: 'width', value: w } }).render().asPng()
          fs.writeFileSync('monoforge-staging/web/public/og-image.png', render(og, 1200))
          fs.writeFileSync('monoforge-staging/web/public/icon-512.png', render(icon, 512))
          fs.writeFileSync('monoforge-staging/web/public/icon-192.png', render(icon, 192))
          fs.writeFileSync('monoforge-staging/web/public/favicon-32.png', render(icon, 32))
          fs.writeFileSync('monoforge-staging/web/public/apple-touch-icon.png', render(icon, 180))
          console.log('renders complete')
          JS
          check() {
            got="$(sha256sum "$1" | cut -d' ' -f1)"
            if [ "$got" != "$2" ]; then echo "PNG SHA GATE FAIL $1: $got"; exit 1; fi
            echo "RENDER OK $1 sha ${got:0:16}"
          }
          check monoforge-staging/web/public/og-image.png          7fe3cb34ede4b20c19f7fb1d027bc88de1beb1bf2495fd57f3d02ff3d3879a9e
          check monoforge-staging/web/public/icon-512.png          38f9d350585c3701db3250b974e605d1ddd2e9681e8acd6c907a55c768774930
          check monoforge-staging/web/public/icon-192.png          f79dcb2917151aefab7d119dceadbc2bb201133fd5ca20ccf91f76fed2011010
          check monoforge-staging/web/public/favicon-32.png        733a254fd01c612c1d6685ce17188c87269488664b693089ce15571f75694674
          check monoforge-staging/web/public/apple-touch-icon.png  54bd65b4afc610267e29d1453ed633a2e3859c1879bfd068b5bf2e80bc674ec1

      - name: Commit emitted files
        run: |
          git config user.name Codebuff
          git config user.email noreply@codebuff.com
          git add monoforge-staging/web
          git commit -m "mono-web-emit: land the web payloads (lock + rendered marks), derived and sha-gated"
          git push
