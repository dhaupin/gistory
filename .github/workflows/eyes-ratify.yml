# CI-cut canon: the .eyes/ ratified:false rows become canon only when the
# pinned environment reproduces the capture byte-identically. Local agents
# (and this dev workspace) PROPOSE baselines; this workflow cuts them.
#
# Manual dispatch only (workflow_dispatch) - not a push gate, on purpose:
# pixel canon changes are deliberate events, and a red gate cannot adopt,
# it can only refuse. If ratify finds DRIFT (baseline not reproducible),
# the adopt-on-drift path proposes pinned-env captures; a fresh dispatch
# is the independent witness that cuts canon. The ledger is append-only.
#
# gistory hosts the eyes at labs/.eyes (next to labs/crashledger.json -
# the family's ledger home in the testbed), NOT the .eyes default, so
# every verb below names BOTH --manifest and --ledger explicitly. Those
# flags are wired in eyestruct-staging/bin/eyestruct.js; without them the
# tool would silently fall back to .eyes/ and write nowhere useful.
#
# What it does: pinned chromium (manifest's exact version) + the prestruct
# bake + a static serve of dist/ + eyestruct ratify against the manifest
# pin. Environment drift across OS/GPU cannot be argued around - only
# reproducibility inside the pin counts as canon.

name: Eyes ratify (CI-cut canon)

on:
  workflow_dispatch:

concurrency:
  group: eyes-ratify
  cancel-in-progress: false

env:
  EYES_MANIFEST: labs/.eyes/manifest.yml
  EYES_LEDGER: labs/.eyes/ledger.json

jobs:
  ratify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the cut: appends its own proof rows to the ledger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (root + eyestruct staging)
        run: |
          npm ci
          npm ci --prefix eyestruct-staging

      # On-demand chromium, the ui:browsers pattern: skipped in install,
      # fetched per machine. Installs the MANIFEST'S PINNED version into
      # ~/.cache/puppeteer/chrome where eyestruct's exec discovery looks
      # (bare `install chrome@stable` drops ./chrome into the worktree,
      # which discovery never sees - and a stable != pinned version dance
      # would make the ledger row claim a pin it did not shoot). @puppeteer
      # /browsers appends its own chrome/ segment under --path, so the
      # cache ROOT is the right argument. The explicit EYESTRUCT_BROWSER
      # export is belt-and-braces so the exact exec is on record.
      - name: Provision the pinned browser
        run: |
          npx --yes @puppeteer/browsers install chrome@154.0.8037.57 --path "$HOME/.cache/puppeteer"
          EXEC="$HOME/.cache/puppeteer/chrome/linux-154.0.8037.57/chrome-linux64/chrome"
          test -x "$EXEC" || (echo "pinned chrome missing after install" && exit 2)
          echo "EYESTRUCT_BROWSER=$EXEC" >> "$GITHUB_ENV"

      # The full prerender pipeline (same gate production used): the ratify
      # captures must shoot what actually ships, not a dev server.
      - name: Bake the site
        run: npx prestruct build

      # Static serve of the baked tree (the app is hash-routed; /#/settings
      # resolves from the same index.html).
      - name: Serve dist
        run: |
          npx --yes http-server dist -p 4173 --silent &
          sleep 3
          curl -sf http://localhost:4173/ >/dev/null || (echo "dev server did not come up" && exit 2)

      # THE CUT: byte-identical reproduction -> append-only ratify rows.
      # Drift exits 1 with a named reason and changes nothing - which is
      # also the honest bootstrap a first dispatch needs: nothing in the
      # toolchain writes <eyes>/<slot>/current.png (walk keeps candidates,
      # adopt writes rows, pixels move only by deliberate git action). So
      # on DRIFT this lane promotes the pinned-env captures into the slots
      # + adopt rows (ratified:false), commits, and a re-dispatch cuts
      # canon. Self-certification is impossible by construction: the
      # ratify decision under canon is always a FRESH dispatch proving a
      # baseline proposed in an EARLIER one.
      - name: Ratify the manifest routes (adopt-on-drift bootstrap)
        run: |
          node eyestruct-staging/bin/eyestruct.js ratify http://localhost:4173/ --manifest "$EYES_MANIFEST" --ledger "$EYES_LEDGER" && exit 0
          echo "drift: promoting pinned-env captures as proposals (walk -> slots -> adopt rows)"
          node eyestruct-staging/bin/eyestruct.js --manifest "$EYES_MANIFEST" --ledger "$EYES_LEDGER" walk http://localhost:4173/
          mkdir -p labs/.eyes/home/desktop-1280-dark labs/.eyes/settings/desktop-1280-dark
          cp .eyes-candidates/walk__root_desktop-1280-dark_dark.png labs/.eyes/home/desktop-1280-dark/current.png
          cp .eyes-candidates/walk__settings_desktop-1280-dark_dark.png labs/.eyes/settings/desktop-1280-dark/current.png
          node eyestruct-staging/bin/eyestruct.js adopt home/desktop-1280-dark --note "bootstrap: pinned-env capture (linux chrome 154.0.8037.57) at labs/.eyes; canon cuts on the next ratify dispatch" --manifest "$EYES_MANIFEST" --ledger "$EYES_LEDGER"
          node eyestruct-staging/bin/eyestruct.js adopt settings/desktop-1280-dark --note "bootstrap: pinned-env capture (linux chrome 154.0.8037.57) at labs/.eyes; canon cuts on the next ratify dispatch" --manifest "$EYES_MANIFEST" --ledger "$EYES_LEDGER"
          echo "proposal committed; re-dispatch eyes-ratify to cut canon"

      - name: Commit the proof rows
        run: |
          if git diff --quiet -- labs/.eyes/; then
            echo "No .eyes/ change - canon was already reproducible."
            exit 0
          fi
          git config user.name "eyestruct ratify"
          git config user.email "actions@users.noreply.github.com"
          git add labs/.eyes/
          git commit -m "ratify: append-only proof rows in the pinned environment (labs/.eyes)"
          git push
