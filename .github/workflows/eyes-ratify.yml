# CI-cut canon: the .eyes/ ratified:false rows become canon only when the
# pinned environment reproduces the capture byte-identically. Local agents
# (and this dev workspace) PROPOSE baselines; this workflow cuts them.
#
# Manual dispatch only (workflow_dispatch) - not a push gate, on purpose:
# pixel canon changes are deliberate events, and a red gate cannot adopt,
# it can only refuse. If ratify finds DRIFT (baseline not reproducible),
# the adopt-on-drift path proposes pinned-env captures; a fresh dispatch
# is the independent witness that cuts canon. The ledger is append-only.
#
# THE EYES HOME IS A HOST DECISION. gistory keeps its eyes at labs/.eyes
# (next to labs/crashledger.json - the family's ledger home in the testbed);
# a repo that IS eyes keeps the tool's .eyes/ default. One constant below;
# every step derives its paths from $EYES_HOME, so a host move is this line
# plus the gate's EYES_HOME default - never a hunt through step bodies.
# The --manifest/--ledger flags are wired in eyestruct's bin/eyestruct.js
# (checked out from dhaupin/eyestruct, upstream since the mount retired);
# without them the tool silently falls back to .eyes/.
#
# Version truth lives in the manifest: the Provision step reads
# pin.browser-image OUT of $EYES_HOME/manifest.yml instead of carrying its
# own copy of the number. A pin bump is then a one-file edit (the
# manifest), and the lane provably shoots the manifest's own claim.
#
# What it does: pinned chromium (manifest's exact version) + the prestruct
# bake + a static serve of dist/ + eyestruct ratify against the manifest
# pin. Environment drift across OS/GPU cannot be argued around - only
# reproducibility inside the pin counts as canon.

name: Eyes ratify (CI-cut canon)

on:
  workflow_dispatch:

concurrency:
  group: eyes-ratify
  cancel-in-progress: false

env:
  EYES_HOME: labs/.eyes

jobs:
  ratify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the cut: appends its own proof rows to the ledger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Eyestruct itself: upstream repo (the gistory staging mount retired
      # 2026-10-27). Pinned to the branch default; the manifest's own pin
      # still drives the browser version below.
      - name: Checkout eyestruct upstream
        uses: actions/checkout@v4
        with:
          repository: dhaupin/eyestruct
          path: eyestruct-upstream

      - name: Install (root + eyestruct upstream)
        run: |
          npm ci
          npm ci --prefix eyestruct-upstream

      # On-demand chromium, the ui:browsers pattern: skipped in install,
      # fetched per machine. Installs the MANIFEST'S PINNED version into
      # ~/.cache/puppeteer/chrome where eyestruct's exec discovery looks
      # (bare `install chrome@stable` drops ./chrome into the worktree,
      # which discovery never sees - and a stable != pinned version dance
      # would make the ledger row claim a pin it did not shoot). The version
      # requirement is parsed from the manifest's pin.browser-image
      # (everything after the last '@'), so the manifest stays the single
      # source of truth for what this lane shoots.
      - name: Provision the pinned browser (version from the manifest)
        run: |
          PIN=$(node -e "const m=require('./eyestruct-upstream/lib/manifest.js');process.stdout.write(m.read('.',{manifest:process.env.EYES_HOME+'/manifest.yml'}).pin['browser-image'])")
          VERSION=${PIN##*@}
          test -n "$VERSION" || (echo "could not parse a version out of pin.browser-image=$PIN" && exit 2)
          npx --yes @puppeteer/browsers install "chrome@$VERSION" --path "$HOME/.cache/puppeteer"
          EXEC="$HOME/.cache/puppeteer/chrome/linux-$VERSION/chrome-linux64/chrome"
          test -x "$EXEC" || (echo "pinned chrome missing after install" && exit 2)
          echo "PINNED_CHROME=$VERSION" >> "$GITHUB_ENV"
          echo "EYESTRUCT_BROWSER=$EXEC" >> "$GITHUB_ENV"

      # The full prerender pipeline (same gate production used): the ratify
      # captures must shoot what actually ships, not a dev server.
      - name: Bake the site
        run: npx prestruct build

      # Static serve of the baked tree (the app is hash-routed; /#/settings
      # resolves from the same index.html).
      - name: Serve dist
        run: |
          npx --yes http-server dist -p 4173 --silent &
          sleep 3
          curl -sf http://localhost:4173/ >/dev/null || (echo "dev server did not come up" && exit 2)

      # THE CUT: byte-identical reproduction -> append-only ratify rows.
      # Drift exits 1 with a named reason and changes nothing - which is
      # also the honest bootstrap a first dispatch needs: nothing in the
      # toolchain writes <slot>/current.png (walk keeps candidates,
      # adopt writes rows, pixels move only by deliberate git action). So
      # on DRIFT this lane promotes the pinned-env captures into the slots
      # + adopt rows (ratified:false), commits, and a re-dispatch cuts
      # canon. Slot dirs and candidate names come from the ENGINE'S OWN
      # modules (ratify.slotDir + walk.candidateName read over the
      # manifest), so the bootstrap can never drift away from how the tool
      # itself names things. Self-certification is impossible by
      # construction: the ratify decision under canon is always a FRESH
      # dispatch proving a baseline proposed in an EARLIER one.
      - name: Ratify the manifest routes (adopt-on-drift bootstrap)
        run: |
          node eyestruct-upstream/bin/eyestruct.js ratify http://localhost:4173/ --manifest "$EYES_HOME/manifest.yml" --ledger "$EYES_HOME/ledger.json" && exit 0
          echo "drift: promoting pinned-env captures as proposals (walk -> slots -> adopt rows)"
          node eyestruct-upstream/bin/eyestruct.js --manifest "$EYES_HOME/manifest.yml" --ledger "$EYES_HOME/ledger.json" walk http://localhost:4173/
          MAP=$(node -e '
            const manifest = require("./eyestruct-upstream/lib/manifest.js")
            const { slotDir } = require("./eyestruct-upstream/lib/ratify.js")
            const { candidateName } = require("./eyestruct-upstream/lib/walk.js")
            const m = manifest.read(".", { manifest: process.env.EYES_HOME + "/manifest.yml" })
            for (const route of m.routes) process.stdout.write(slotDir(route) + " " + candidateName(route) + "\n")
          ')
          echo "manifest-derived slots:"
          printf '%s\n' "$MAP"
          while read -r SLOT CAND; do
            test -f ".eyes-candidates/$CAND" || (echo "walk did not produce $CAND" && exit 2)
            mkdir -p "$EYES_HOME/$SLOT"
            cp ".eyes-candidates/$CAND" "$EYES_HOME/$SLOT/current.png"
            node eyestruct-upstream/bin/eyestruct.js adopt "$SLOT" --note "bootstrap: pinned-env capture (linux chrome ${PINNED_CHROME:-pinned}) at $EYES_HOME; canon cuts on the next ratify dispatch" --manifest "$EYES_HOME/manifest.yml" --ledger "$EYES_HOME/ledger.json"
          done <<< "$MAP"
          echo "proposal committed; re-dispatch eyes-ratify to cut canon"

      - name: Commit the proof rows
        run: |
          if git diff --quiet -- "$EYES_HOME/"; then
            echo "No .eyes/ change - canon was already reproducible."
            exit 0
          fi
          git config user.name "eyestruct ratify"
          git config user.email "actions@users.noreply.github.com"
          git add "$EYES_HOME/"
          git commit -m "ratify: append-only proof rows in the pinned environment ($EYES_HOME)"
          git push
