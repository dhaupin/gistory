# One-shot: the tri-pin adoption's LOCKFILES + the TASKS rider, in one
# atomic commit. The pins rode the carrier commit 8df001c* by hand (the
# package.jsons are the contract); the LOCKFILES are NEVER hand-carried -
# they derive here by `npm install --package-lock-only` for BOTH trees
# (poststruct-staging + monoforge-staging), gated on all six exact pins
# (eyestruct 1.0.0 / packstruct 1.0.0 / crashtest 1.1.0 in each lock), and
# monoforge's battery stops borrowing a sibling's node_modules from this
# commit on (standalone-hermetic, gistory#30's resolvers law).
#
# Gates (any refusal exits before the commit):
#   before: labs/TASKS.md must still be the pre-landing blob de6d8868*
#           (never graft work-log rows onto a drifted base)
#   after:  both derived locks pin all three family tools EXACT
#   after:  npm ci proven for both trees, both batteries green
#   after:  eyestruct's manifest + runtime both carry 1.0.0
#
# The lane yml itself is NOT deleted from the runner push: a commit touching
# .github/workflows needs the workflows scope, which this Contents-token
# push cannot carry (the move-day law). It is retired through the host lane
# right after the green run.
#
# Resolution note (the first run's receipt): the eyestruct probe must use a
# manifest read + an in-tree bare require. Node's law: the exports map
# applies to BARE specifiers only, a relative filesystem path bypasses it,
# and eyestruct's package.json carries no `main`, so a require of the
# package root by path fell through to the file-resolution fallback
# (./index.js, which the package does not ship) and answered
# MODULE_NOT_FOUND from [eval]. The manifest read (package.json IS a
# mounted file, no exports involved) + `(cd poststruct-staging && node -e
# require('eyestruct'))` (a bare specifier from inside the tree, where the
# resolver walks into node_modules) are the honest probes.
name: "tri-pins: derived locks + the TASKS rider"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tri-pins-lock
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: "Gate the TASKS base (no grafting onto a drifted work log)"
        run: |
          set -euo pipefail
          BEFORE="$(git rev-parse HEAD:labs/TASKS.md)"
          if [ "$BEFORE" != "de6d8868c080423766cfc30b76e0452ba1e6b411" ]; then
            echo "labs/TASKS.md base is $BEFORE, expected de6d8868* - refusing to graft the rider onto a drifted base"
            exit 1
          fi
          echo "TASKS base byte-exact"

      - name: Derive the lockfiles + gate all six pins
        run: |
          set -euo pipefail
          npm install --package-lock-only --prefix poststruct-staging --no-audit --no-fund
          npm install --package-lock-only --prefix monoforge-staging --no-audit --no-fund
          node -e "const fs=require('fs');for(const p of ['poststruct-staging/package-lock.json','monoforge-staging/package-lock.json']){const lock=JSON.parse(fs.readFileSync(p,'utf8'));const want={eyestruct:'1.0.0',packstruct:'1.0.0',crashtest:'1.1.0'};for(const t in want){const e=lock.packages['node_modules/'+t];if(!e||e.version!==want[t]){console.error(p+': eyestruct/packstruct/crashtest pin failure at '+t+' ('+(e&&e.version)+')');process.exit(1)}}console.log(p+': all three family tools pinned EXACT')}"
          npm ci --prefix poststruct-staging --no-audit --no-fund --ignore-scripts
          npm ci --prefix monoforge-staging --no-audit --no-fund --ignore-scripts
          echo "both trees install clean from the derived locks"

      - name: "Prove the tool + run both batteries"
        run: |
          set -euo pipefail
          node -e "const p=require('./poststruct-staging/node_modules/eyestruct/package.json');if(p.version!=='1.0.0'){console.error('eyestruct manifest says '+p.version);process.exit(1)}console.log('eyestruct manifest pinned EXACT 1.0.0 on the derivation')"
          (cd poststruct-staging && node -e "const e=require('eyestruct');if(e.version!=='1.0.0'){console.error('eyestruct runtime says '+e.version);process.exit(1)}console.log('eyestruct '+e.version+' live on the derivation')")
          npm test --prefix monoforge-staging
          npm run check --prefix poststruct-staging

      - name: Append the TASKS rider
        run: |
          set -euo pipefail
          printf %s '' | base64 -d > /tmp/tri-rider.md
          node -e 'const fs=require("fs");const r=fs.readFileSync("/tmp/tri-rider.md","utf8");const p="labs/TASKS.md";let t=fs.readFileSync(p,"utf8");if(t.includes("Tri-pin block")){console.log("rider already present");process.exit(0)}const nl=String.fromCharCode(10);const a="## Now"+nl;if(!t.includes(a))process.exit(4);fs.writeFileSync(p,t.replace(a,a+nl+r));console.log("rider appended to labs/TASKS.md")'

      - name: Atomic commit (locks + rider)
        run: |
          set -euo pipefail
          git config user.name "Codebuff"
          git config user.email "noreply@codebuff.com"
          git add package-lock.json poststruct-staging/package-lock.json monoforge-staging/package-lock.json labs/TASKS.md
          git status --porcelain
          git commit -m "tri-pins: the derived lockfiles + the TASKS rider (the pins' lane)" -m "The trio rides both mounts at EXACT pins (eyestruct 1.0.0 / packstruct 1.0.0 / crashtest 1.1.0; the package.jsons rode 8df001c* by hand). The lockfiles derive here on the runner - never hand-carried - gated on all six pins, both trees npm-ci proven, both batteries green, and the tri-pin work-log row lands atomically with the locks (base blob de6d8868* gated). monoforge's battery resolves the family from its OWN node_modules from this commit on: standalone-hermetic, no sibling borrow."
          git push
          echo "pushed: $(git rev-parse HEAD)"
