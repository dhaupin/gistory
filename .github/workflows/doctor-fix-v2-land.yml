# ONE-SHOT (issue#8, part 1): compose doctor-fix-emit v2 from v1-in-history
# plus the committed v2 patch handoff - a transport with zero nested heredocs
# and zero giant strings: both payloads ride the commit lane as their own
# files, and the composition is blob-gated at every step.
name: doctor-fix-v2-land

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compose v2 (v1 + committed patch handoff, blob-gated)
        run: |
          set -euo pipefail
          git show e60b66131fc9f3b2420852315b9a233dbf3c1e98:.github/workflows/doctor-fix-emit.yml \
            > .github/workflows/doctor-fix-emit.yml
          v1_blob="$(git hash-object .github/workflows/doctor-fix-emit.yml)"
          test "$v1_blob" = "48333d924a3f4186ab1f5006a08971b106ff0c59" \
            || { echo "V1 GATE FAIL: $v1_blob (expected 48333d92)"; exit 1; }
          git show HEAD:monoforge-staging/horcrux/handoff/v2-step.patch > /tmp/v2-step.patch
          p_blob="$(git hash-object /tmp/v2-step.patch)"
          test "$p_blob" = "a351d44ab2e2c094d2997547a8504a3d8e5bdd84" \
            || { echo "V2 PATCH HANDOFF GATE FAIL: $p_blob (expected a351d44a)"; exit 1; }
          patch --force --quiet .github/workflows/doctor-fix-emit.yml -i /tmp/v2-step.patch \
            || { echo "V2 COMPOSE PATCH FAIL: v1 did not accept the hunk"; exit 1; }
          b="$(git hash-object .github/workflows/doctor-fix-emit.yml)"
          test "$b" = "452ccfaa8f01cdb3b1b8129e71779d176b7ec500" \
            || { echo "V2 COMPOSE GATE FAIL: composed blob drifts: $b (expected 452ccfaa)"; exit 1; }
          echo "v2 composed byte-exact: blob 452ccfaa"

      - name: Commit the composed v2
        run: |
          set -euo pipefail
          git config user.name  "doctor-fix-v2-land"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/doctor-fix-emit.yml
          if ! git diff --cached --quiet; then
            git commit -m "monoforge: the landed doctor-fix-emit v2 (composed from history + handoff, blob-gated)" \
                       -m "Composed on the runner from the v1 already in git history plus the committed v2 patch handoff, blob-gated to 452ccfaa, so the drifted v1 landing (P64 + mkdir) is repaired by construction, not by extending the same carry class."
            git pull --rebase origin main
            git push origin main
          else
            echo "nothing to commit (v2 already current)"
          fi
