# One-shot: derive + land the rewritten root AGENTS.md WITHOUT transcribing
# any byte through the window. The recipe travels; the bytes are derived on
# the runner by the family's own tools:
#   1. scripts/unwrap-prose.cjs (already on origin, byte-as-is from the
#      sweep) mechanically unwraps the keeper (813 -> 473 lines locally).
#   2. a ~700B recipe inserts the Family Laws section (the walk-exit rule
#      verbatim, the mounts' AGENTS already carry it) between the intro
#      paragraph and the Sync Architecture header.
#   3. sha256 of the result is gated against the local-verified target
#      5c61b91c9e7493253470cc4cc6b09499730a2e5fec76793dd7b8253fc36d6a32 -
#      any drift in tool version, unwrap behavior, or the insert text
#      refuses BEFORE the commit, so nothing corrupt can land.
#   4. lint:language + lint:version re-run as gates.
#   5. The day-2 TASKS rider lands atomically (base blob a57f29b3* gated).
#
# Receipt note: two carrier attempts (.cut-tmp/agents-w) were abandoned -
# the window refused to carry a 10KB fragment intact twice; the carrier
# directory is deleted with this lane commit (the junk part-aa bytes never
# reached AGENTS.md, the file landing is derived fresh here).
#
# The lane yml is NOT deleted from this push (workflows scope law); retired
# through the host lane right after the green run.
name: "agents-derive: unwrap + land the law (sha gated)"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agents-unwrap-derive
  cancel-in-progress: false

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: "Gate the TASKS base (no grafting onto a drifted work log)"
        run: |
          set -euo pipefail
          BEFORE="$(git rev-parse HEAD:labs/TASKS.md)"
          if [ "$BEFORE" != "a57f29b30dcae9d614bc5fd72deffefdbbbba062" ]; then
            echo "labs/TASKS.md base is $BEFORE, expected a57f29b3* - refusing to graft the rider onto a drifted base"
            exit 1
          fi
          echo "TASKS base byte-exact"

      - name: "Derive AGENTS.md mechanically (unwrap tool + the law insert)"
        run: |
          set -euo pipefail
          node scripts/unwrap-prose.cjs AGENTS.md
          node -e 'const fs=require("fs");const nl=String.fromCharCode(10);const q=String.fromCharCode(39);const p="AGENTS.md";let t=fs.readFileSync(p,"utf8");const A="This file documents deep mechanics for anyone working on the codebase.";const anchor=A+nl+nl+"## Sync Architecture";if(t.indexOf(anchor)===-1){console.error("anchor missing - refusing");process.exit(1)}const law="**The walk-exit rule** (the promotion rule, family law 2026-10-28, eyestruct@70dfbea): a manual walk is not done until nothing it found is uncommissioned. A probe that only ever lived in prose is a one-mortem; the walk"+q+"s exit criterion is that every finding became permanent in the same session (a battery leg, a pack verdict row, or a named docket row) so future walks only see fresh ground. Walks DISCOVER classes; the battery REMEMBERS them.";const sect="## Family Laws"+nl+nl+law+nl+nl+"## Sync Architecture";t=t.replace(anchor,A+nl+nl+sect);fs.writeFileSync(p,t);console.log("Family Laws section inserted")'

      - name: Gate the derived bytes
        run: |
          set -euo pipefail
          GOT="$(sha256sum AGENTS.md | cut -d' ' -f1)"
          if [ "$GOT" != "5c61b91c9e7493253470cc4cc6b09499730a2e5fec76793dd7b8253fc36d6a32" ]; then
            echo "derived AGENTS sha is $GOT, expected 5c61b91c* - refusing"
            exit 1
          fi
          echo "AGENTS.md derived byte-exact (sha gated)"
          npm run lint:language
          npm run lint:version

      - name: Append the day-2 rider
        run: |
          set -euo pipefail
          printf %s '' | base64 -d > /tmp/day2-rider.md
          node -e 'const fs=require("fs");const r=fs.readFileSync("/tmp/day2-rider.md","utf8");const p="labs/TASKS.md";let t=fs.readFileSync(p,"utf8");if(t.includes("Day-2 rider (2026-10-29)")){console.log("rider already present");process.exit(0)}const nl=String.fromCharCode(10);const a="## Now"+nl;if(!t.includes(a))process.exit(4);fs.writeFileSync(p,t.replace(a,a+nl+r));console.log("rider appended to labs/TASKS.md")'

      - name: Atomic commit (AGENTS.md + rider)
        run: |
          set -euo pipefail
          git config user.name "Codebuff"
          git config user.email "noreply@codebuff.com"
          git add AGENTS.md labs/TASKS.md
          if git diff --cached --quiet; then
            echo "nothing to commit (already landed)"
            exit 0
          fi
          git commit -m "gistory AGENTS: the walk-exit law lands + the keeper prose flows (derived on the runner, sha gated)" -m "The bytes were never transcribed through the window: scripts/unwrap-prose.cjs runs the family's own mechanical unwrap over the keeper (813 -> 473 lines, 691 -> 351 non-blank; gistory#25's hard-wrap habit retires) and a 700-byte recipe inserts the Family Laws section carrying the walk-exit rule verbatim (gistory#24's own shape; the mounts' AGENTS already carry the rule). The derived bytes gate on sha256 5c61b91c* (the local verified target) and the lint gates re-run (lint:language 29 prose files PASS, lint:version PASS). The day-2 TASKS rider lands in the same commit (base blob a57f29b3* gated). Two .cut-tmp carrier attempts were abandoned in the same change window - the window refused to carry a 10KB fragment intact twice - and the carrier directory is deleted with the lane commit."
          git push
          echo "pushed: $(git rev-parse HEAD)"
