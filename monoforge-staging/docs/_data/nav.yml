# monoforge docs nav (single nav source; the layout reads site.data.nav)
# URLs are deployment paths (baseurl-prefixed), matched 1:1 against each
# page's frontmatter permalink - scripts/check-docs-*.cjs hold this honest.

- title: Start
  items:
    - title: Home
      url: /monoforge/
    - title: Verbs
      url: /monoforge/verbs
    - title: Packs
      url: /monoforge/packs
    - title: Search
      url: /monoforge/search
- title: Operations
  items:
    - title: Playbooks
      url: /monoforge/playbooks
    - title: CI
      url: /monoforge/ci
- title: Web
  items:
    # External - the layout branches on '://' (target=_blank, no active
    # match) so this never races the permalink matching of the internal
    # items, and no 1:1 nav gate knows it.
    - title: Web site
      url: https://monoforge.creadev.org/
