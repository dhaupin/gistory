# monoforge's own battery - the tar-move plan's injected change #1, so
# move day's first standalone push is gated by its own CI, not the borrow.
# The factory is zero-dep: no install step exists to run. The battery is
# the negative test (test/run.mjs) plus the docs gates and the language
# gate - the same lanes gistory's staging-hosts leg runs for the mounts.
name: test

on:
  push:
  pull_request:

jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Factory self-test (stamp + doctor refusals)
        run: npm test

      - name: Docs gates (rig checkers)
        run: npm run lint:docs

      - name: Language gate (English-only prose)
        run: npm run lint:language
