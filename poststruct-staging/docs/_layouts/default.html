<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <!-- Freestruct completes canonical/OG/Twitter/JSON-LD post-render; the head stays honest upstream -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <!-- Wide tables scroll in their own box (gistory#16 family guard; eyestruct
       138fda9 worked example) - the jekyll default theme pins the page to a
       table's min-content width on phones otherwise. -->
  <style>
    main { min-width: 0; }
    main table { display: block; width: 100%; overflow-x: auto;
      -webkit-overflow-scrolling: touch; border-collapse: collapse; }
    main table td code { white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}">poststruct</a>
    <button class="burger" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <nav class="nav-list">
      <a href="{{ '/' | relative_url }}">home</a> ·
      <a href="{{ '/checks' | relative_url }}">check catalog</a> ·
      <a href="{{ '/packs' | relative_url }}">packs</a> ·
      <a href="{{ '/playbooks' | relative_url }}">playbooks</a> ·
      <a href="{{ '/ci' | relative_url }}">ci</a> ·
      <a href="{{ '/discussions' | relative_url }}">release posts</a> ·
      <a href="https://www.npmjs.com/package/poststruct">npm</a> ·
      <a href="https://poststruct.creadev.org/">web</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>© {{ 'now' | date: '%Y' }} poststruct - audit what shipped · maintained by <a href="https://github.com/dhaupin/poststruct">dhaupin</a> · made by <a href="https://creadev.org">Creadev.org</a> · part of the struct family</p>
  </footer>
<script>document.querySelector('.burger').addEventListener('click',()=>{const n=document.querySelector('.nav-list');n.classList.toggle('open');document.querySelector('.burger').setAttribute('aria-expanded',n.classList.contains('open'))})</script>
</body>
</html>
