name: docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/**', '.github/workflows/docs.yml']
  workflow_dispatch:

# GitHub Pages deploy permissions (official deploy-pages action)
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # Docs truth gates (ported house checkers): frontmatter 5-field law,
      # resolvable links, style law (no dashes in prose, language-tagged
      # fences, no trailing ws), fiction-signature + Jekyll-filter trap
      # scanners (the rig-pass generation, gistory#23), English-only prose.
      - name: Docs gates
        run: |
          node scripts/check-docs-frontmatter.cjs
          node scripts/check-docs-links.cjs
          node scripts/check-docs-style.cjs
          node scripts/check-fiction-signatures.cjs
          node scripts/check-jekyll-filters.cjs
          node scripts/check-language.cjs

      # Shell-residue gate (issue gistory#12): the flowforge shell edition
      # served literal placeholders live on eyestruct until 2d89b5b because
      # nothing grepped for them. Both mounts inherit the guard, not the bug.
      - name: Shell-residue gate
        run: |
          if grep -rInE 'your-site\.example\.com|your-org/your-project|Your Site Docs|Home / Your Site|made by your org' docs/_layouts docs/_config.yml docs/freestruct.config.yml; then
            echo "SHELL RESIDUE: identity placeholders found above"
            exit 1
          fi
          echo "shell-residue gate: clean"
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install deps
        run: |
          npm ci

      - name: Build docs
        run: |
          bundle exec jekyll build
          npm --prefix . exec --yes freestruct@1.1.0 -- dist/ --strict
          npm exec --yes pagefind --site docs/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_site'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
